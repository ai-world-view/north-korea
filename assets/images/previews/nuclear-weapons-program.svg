<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Nuclear Weapons Program — DPRK Historical Plate</title>
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc0" />
      <stop offset="50%" stop-color="#ddd0a8" />
      <stop offset="100%" stop-color="#c9bc90" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#00000000" />
      <stop offset="100%" stop-color="#3a2a1055" />
    </radialGradient>
    <radialGradient id="blast" cx="50%" cy="80%" r="80%">
      <stop offset="0%" stop-color="#e8b84a" />
      <stop offset="45%" stop-color="#b5622a" />
      <stop offset="100%" stop-color="#6b2a1a" />
    </radialGradient>
    <pattern id="hatch" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#8a7545" stroke-width="0.4" opacity="0.3" />
    </pattern>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3a2500" flood-opacity="0.35" />
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#1a0e00" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="url(#parchment)" />
  <rect width="1536" height="1024" fill="url(#hatch)" />

  <rect x="18" y="18" width="1500" height="988" rx="4" fill="none" stroke="#7a6030" stroke-width="6" />
  <rect x="28" y="28" width="1480" height="968" rx="3" fill="none" stroke="#9a8050" stroke-width="2" />
  <rect x="32" y="32" width="1472" height="960" rx="2" fill="none" stroke="#7a6030" stroke-width="1" />

  <g stroke="#7a6030" stroke-width="2" fill="none">
    <line x1="18" y1="60" x2="60" y2="60" /><line x1="60" y1="18" x2="60" y2="60" />
    <line x1="1476" y1="60" x2="1518" y2="60" /><line x1="1476" y1="18" x2="1476" y2="60" />
    <line x1="18" y1="964" x2="60" y2="964" /><line x1="60" y1="964" x2="60" y2="1006" />
    <line x1="1476" y1="964" x2="1518" y2="964" /><line x1="1476" y1="964" x2="1476" y2="1006" />
  </g>

  <!-- Right imagery panel: mushroom cloud + atom orbits -->
  <g transform="translate(1080, 0)">
    <!-- ground -->
    <line x1="-260" y1="720" x2="300" y2="720" stroke="#7a6030" stroke-width="2" opacity="0.6" />
    <!-- mushroom cloud -->
    <g filter="url(#softShadow)">
      <path d="M 0,720 C -30,600 -46,520 -30,470 C -70,470 -110,440 -110,390 C -150,400 -190,370 -180,320 C -230,320 -250,270 -220,230 C -250,180 -210,120 -150,130 C -140,70 -70,50 -20,90 C 20,40 110,50 130,120 C 200,110 240,170 210,220 C 250,260 230,320 180,320 C 190,370 150,410 110,395 C 116,445 78,478 34,470 C 50,530 34,620 0,720 Z"
            fill="url(#blast)" stroke="#5a2010" stroke-width="2.5" />
      <path d="M 0,720 C -30,600 -46,520 -30,470 C 50,530 34,620 0,720 Z" fill="#8a3a1a" opacity="0.5" />
    </g>
    <!-- atom orbits overlay -->
    <g transform="translate(0, 300)" stroke="#e8dfc0" stroke-width="3" fill="none" opacity="0.55">
      <ellipse cx="0" cy="0" rx="150" ry="58" />
      <ellipse cx="0" cy="0" rx="150" ry="58" transform="rotate(60)" />
      <ellipse cx="0" cy="0" rx="150" ry="58" transform="rotate(120)" />
      <circle cx="0" cy="0" r="16" fill="#f5e8c0" stroke="#5a2010" stroke-width="2" />
    </g>
  </g>

  <!-- Left text panel -->
  <rect x="50" y="50" width="640" height="924" rx="3" fill="#d8c898" opacity="0.5" />
  <rect x="50" y="50" width="640" height="924" fill="url(#hatch)" opacity="0.4" />
  <line x1="710" y1="60" x2="710" y2="964" stroke="#7a6030" stroke-width="3" />
  <line x1="715" y1="60" x2="715" y2="964" stroke="#9a8050" stroke-width="1" />

  <text x="370" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="bold" fill="#2a1505" text-anchor="middle" letter-spacing="2" filter="url(#textShadow)">Nuclear</text>
  <text x="370" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="bold" fill="#2a1505" text-anchor="middle" letter-spacing="1" filter="url(#textShadow)">Weapons Program</text>
  <text x="370" y="262" font-family="Georgia, serif" font-size="22" fill="#6a4010" text-anchor="middle" font-style="italic" letter-spacing="1">Democratic People's Republic of Korea</text>

  <line x1="110" y1="285" x2="630" y2="285" stroke="#7a6030" stroke-width="2" />
  <line x1="140" y1="290" x2="600" y2="290" stroke="#9a8050" stroke-width="1" />

  <g font-family="Georgia, serif">
    <text x="110" y="345" font-size="19" fill="#3a2810" font-weight="bold">Initiated:</text>
    <text x="630" y="345" font-size="19" fill="#5a4030" text-anchor="end" font-style="italic">early 1980s (covert)</text>
    <line x1="110" y1="362" x2="630" y2="362" stroke="#9a8050" stroke-width="0.8" opacity="0.6" />

    <text x="110" y="408" font-size="19" fill="#3a2810" font-weight="bold">First test:</text>
    <text x="630" y="408" font-size="19" fill="#5a4030" text-anchor="end" font-style="italic">9 October 2006 · Punggye-ri</text>
    <line x1="110" y1="425" x2="630" y2="425" stroke="#9a8050" stroke-width="0.8" opacity="0.6" />

    <text x="110" y="471" font-size="19" fill="#3a2810" font-weight="bold">Tests:</text>
    <text x="630" y="471" font-size="19" fill="#5a4030" text-anchor="end" font-style="italic">six (2006–2017)</text>
    <line x1="110" y1="488" x2="630" y2="488" stroke="#9a8050" stroke-width="0.8" opacity="0.6" />

    <text x="110" y="534" font-size="19" fill="#3a2810" font-weight="bold">Arsenal:</text>
    <text x="630" y="534" font-size="19" fill="#5a4030" text-anchor="end" font-style="italic">est. 50–80 warheads (2024)</text>
    <line x1="110" y1="551" x2="630" y2="551" stroke="#9a8050" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- test timeline -->
  <text x="370" y="618" font-family="Georgia, serif" font-size="18" fill="#6a4010" text-anchor="middle" letter-spacing="1">Six Nuclear Tests</text>
  <line x1="120" y1="668" x2="620" y2="668" stroke="#7a6030" stroke-width="1.5" />
  <g font-family="Georgia, serif" font-size="14" fill="#5a4030" text-anchor="middle">
    <g fill="#8b1a1a" stroke="#3a0a0a" stroke-width="1">
      <circle cx="120" cy="668" r="6" /><circle cx="220" cy="668" r="6" /><circle cx="320" cy="668" r="6" />
      <circle cx="420" cy="668" r="6" /><circle cx="520" cy="668" r="6" /><circle cx="620" cy="668" r="9" />
    </g>
    <text x="120" y="700" fill="#5a4030">'06</text>
    <text x="220" y="700" fill="#5a4030">'09</text>
    <text x="320" y="700" fill="#5a4030">'13</text>
    <text x="420" y="700" fill="#5a4030">'16</text>
    <text x="520" y="700" fill="#5a4030">'16</text>
    <text x="620" y="700" fill="#8b1a1a" font-weight="bold">'17</text>
  </g>
  <text x="620" y="642" font-family="Georgia, serif" font-size="13" fill="#8b1a1a" text-anchor="middle" font-style="italic">thermonuclear</text>

  <rect x="110" y="740" width="520" height="140" rx="3" fill="#6b2a2a" stroke="#3a0a0a" stroke-width="2" filter="url(#softShadow)" opacity="0.92" />
  <text x="370" y="784" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#f5e8c0" text-anchor="middle" letter-spacing="2">BYUNGJIN · DETERRENT COMPLETE</text>
  <text x="370" y="820" font-family="Georgia, serif" font-size="15" fill="#e0c890" text-anchor="middle" font-style="italic">Hwasong ICBMs · SLBMs · 2022 nuclear law</text>
  <text x="370" y="850" font-family="Georgia, serif" font-size="15" fill="#e0c890" text-anchor="middle" font-style="italic">"irreversible" status · non-negotiable</text>
  <text x="370" y="874" font-family="Georgia, serif" font-size="13" fill="#c8a870" text-anchor="middle">the regime's central survival strategy</text>

  <text x="370" y="945" font-family="Georgia, serif" font-size="16" fill="#8a6030" text-anchor="middle" font-style="italic" letter-spacing="1">History</text>

  <text x="1400" y="985" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#8a7550" font-style="italic" opacity="0.6">Atlas Plate · DPRK · Korean Peninsula</text>

  <rect width="1536" height="1024" fill="url(#vignette)" />
</svg>
