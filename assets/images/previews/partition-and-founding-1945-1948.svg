<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Partition and Founding (1945–1948) — Korea divided at the 38th Parallel</title>

  <defs>
    
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9c9a3" />
      <stop offset="100%" stop-color="#c4b08a" />
    </linearGradient>
    
    <linearGradient id="northGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a9e9f" />
      <stop offset="100%" stop-color="#5a8080" />
    </linearGradient>
    
    <linearGradient id="southGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4855a" />
      <stop offset="100%" stop-color="#a8623a" />
    </linearGradient>
    
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="0.3" stroke-opacity="0.08" />
    </pattern>
    
    <linearGradient id="oceanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8cfd8" />
      <stop offset="100%" stop-color="#9ab8c5" />
    </linearGradient>
    
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="100%" stop-color="#3a2a10" stop-opacity="0.45" />
    </radialGradient>
    
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c1e0e" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#1a1005" stop-opacity="0.92" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#3a2a10" flood-opacity="0.35" />
    </filter>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#bgGrad)" />

  
  <rect x="18" y="18" width="1500" height="988" fill="none" stroke="#7a5c2e" stroke-width="3" rx="2" />
  
  <rect x="26" y="26" width="1484" height="972" fill="none" stroke="#7a5c2e" stroke-width="1" rx="1" />

  
  <rect x="60" y="60" width="1416" height="904" fill="url(#oceanGrad)" rx="2" opacity="0.55" />

  
  <g stroke="#7a9e9f" stroke-width="0.6" stroke-opacity="0.3">
