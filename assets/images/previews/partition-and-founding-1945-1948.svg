  <text x="1220" y="390" font-family="Georgia, serif" font-size="16" fill="#4a6a7a" text-anchor="middle" font-style="italic" opacity="0.75" transform="rotate(-5,1220,390)">Sea of Japan</text>

  
  <text x="700" y="490" font-family="Georgia, serif" font-size="16" fill="#4a6a7a" text-anchor="middle" font-style="italic" opacity="0.75" transform="rotate(10,700,490)">Yellow Sea</text>

  
  <line x1="640" y1="60" x2="640" y2="964" stroke="#7a5c2e" stroke-width="1.5" stroke-dasharray="8,5" opacity="0.4" />

  
  
