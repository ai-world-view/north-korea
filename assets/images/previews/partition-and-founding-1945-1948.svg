  <text x="343" y="160" font-family="Georgia, serif" font-size="15" fill="#e8d44d" text-anchor="middle" letter-spacing="5" opacity="0.9">HISTORY</text>

  
  <text x="343" y="240" font-family="Georgia, serif" font-size="58" fill="#f0e8d4" text-anchor="middle" font-weight="bold" letter-spacing="1">Partition</text>
  <text x="343" y="305" font-family="Georgia, serif" font-size="58" fill="#f0e8d4" text-anchor="middle" font-weight="bold" letter-spacing="1">&amp; Founding</text>

  
  <rect x="160" y="330" width="366" height="50" fill="#e8d44d" rx="2" />
  <text x="343" y="365" font-family="Georgia, serif" font-size="30" fill="#1a1005" text-anchor="middle" font-weight="bold" letter-spacing="4">1945 – 1948</text>

  
  <line x1="120" y1="408" x2="566" y2="408" stroke="#e8d44d" stroke-width="1" opacity="0.4" />

  
  <text x="343" y="450" font-family="Georgia, serif" font-size="17" fill="#d4c0a0" text-anchor="middle" font-style="italic" opacity="0.9">The division of Korea at the 38th Parallel</text>
  <text x="343" y="475" font-family="Georgia, serif" font-size="17" fill="#d4c0a0" text-anchor="middle" font-style="italic" opacity="0.9">and the founding of the DPRK</text>

  
  <line x1="120" y1="505" x2="566" y2="505" stroke="#7a5c2e" stroke-width="1" opacity="0.5" />

  
  <text x="343" y="545" font-family="Georgia, serif" font-size="13" fill="#e8d44d" text-anchor="middle" letter-spacing="4" opacity="0.8">KEY FIGURES</text>
  <text x="343" y="580" font-family="Georgia, serif" font-size="16" fill="#c8b890" text-anchor="middle">Kim Il-sung · Pak Hon-yong</text>
  <text x="343" y="605" font-family="Georgia, serif" font-size="16" fill="#c8b890" text-anchor="middle">Cho Man-sik · Terenti Shtykov</text>
  <text x="343" y="630" font-family="Georgia, serif" font-size="16" fill="#c8b890" text-anchor="middle">Dean Rusk · Charles Bonesteel</text>

  
  <line x1="120" y1="660" x2="566" y2="660" stroke="#7a5c2e" stroke-width="1" opacity="0.5" />

  
  <text x="343" y="705" font-family="Georgia, serif" font-size="13" fill="#e8d44d" text-anchor="middle" letter-spacing="4" opacity="0.8">38TH PARALLEL</text>
  <text x="343" y="738" font-family="Georgia, serif" font-size="15" fill="#c8b890" text-anchor="middle" font-style="italic">Drawn on the night of August 10–11, 1945</text>
  <text x="343" y="762" font-family="Georgia, serif" font-size="15" fill="#c8b890" text-anchor="middle" font-style="italic">by Rusk &amp; Bonesteel using a National</text>
  <text x="343" y="786" font-family="Georgia, serif" font-size="15" fill="#c8b890" text-anchor="middle" font-style="italic">Geographic map — Seoul placed in U.S. zone</text>

  
  <line x1="100" y1="864" x2="585" y2="864" stroke="#e8d44d" stroke-width="0.5" opacity="0.4" />
  <line x1="100" y1="870" x2="585" y2="870" stroke="#e8d44d" stroke-width="1.5" opacity="0.6" />

  
  
