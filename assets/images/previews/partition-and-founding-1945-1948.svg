  <line x1="720" y1="412" x2="1200" y2="412" stroke="#e8d44d" stroke-width="4" stroke-dasharray="18,7" stroke-linecap="round" filter="url(#shadow)" />
  
  <rect x="1205" y="398" width="110" height="28" fill="#2c1e0e" rx="3" opacity="0.8" />
