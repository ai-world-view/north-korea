    <linearGradient id="overlayGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="0.82" />
      <stop offset="55%" stop-color="#1a1a2e" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="gridPat" width="60" height="60" patternUnits="userSpaceOnUse">
