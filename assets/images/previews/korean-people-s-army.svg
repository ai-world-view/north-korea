    </pattern>
    <pattern id="hatchPat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c4b48a" stroke-width="0.8" opacity="0.4" />
    </pattern>
    <filter id="roughen">
