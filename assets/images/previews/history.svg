<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>History — North Korea Knowledge Base</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c9a8" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8cccc" />
      <stop offset="100%" stop-color="#9ab5b8" />
    </linearGradient>
    <linearGradient id="landgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8b98a" />
      <stop offset="100%" stop-color="#b8a870" />
    </linearGradient>
    <linearGradient id="nkgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a7455" />
      <stop offset="100%" stop-color="#7a6445" />
    </linearGradient>
    <filter id="tex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
      <feComposite in="blend" in2="SourceGraphic" operator="in" />
    </filter>
    <pattern id="gridpat" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 0 60" fill="none" stroke="#a09060" stroke-width="0.5" opacity="0.4" />
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#7a6a4a" stroke-width="0.8" opacity="0.3" />
    </pattern>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#bg)" />
  <rect width="1536" height="1024" fill="url(#gridpat)" />

  
  <ellipse cx="900" cy="550" rx="700" ry="500" fill="url(#sea)" opacity="0.7" />
  <ellipse cx="350" cy="500" rx="400" ry="380" fill="url(#sea)" opacity="0.5" />

  
  <path d="M0,0 L700,0 L720,80 L680,150 L700,220 L650,280 L600,300 L550,350 L480,370 L420,420 L380,460 L300,480 L200,500 L100,520 L0,540 Z" fill="url(#landgrad)" stroke="#9a8a60" stroke-width="2" />

  
  <path d="M680,0 L1536,0 L1536,200 L1400,220 L1300,200 L1200,240 L1100,220 L1000,260 L900,240 L800,200 L750,150 L720,80 Z" fill="url(#landgrad)" stroke="#9a8a60" stroke-width="2" />

  
  <path d="M480,370 L520,360 L560,340 L590,360 L610,380 L630,400 L640,440 L650,480 L645,520 L640,560 L630,600 L620,640 L600,670 L580,700 L560,720 L545,700 L530,670 L520,640 L510,600 L500,560 L490,520 L480,480 L460,450 L440,420 L450,390 Z" fill="url(#landgrad)" stroke="#9a8a60" stroke-width="2.5" />

  
  <path d="M480,370 L520,360 L560,340 L590,360 L610,380 L630,400 L640,440 L650,480 L645,510 L620,510 L580,520 L540,515 L500,520 L470,510 L455,490 L460,450 L440,420 L450,390 Z" fill="url(#nkgrad)" stroke="#5a4a30" stroke-width="3" />

  
  <path d="M470,510 L500,520 L540,515 L580,520 L620,510 L645,510 L645,520 L640,560 L630,600 L620,640 L600,670 L580,700 L560,720 L545,700 L530,670 L520,640 L510,600 L500,560 L490,520 Z" fill="#c4b47e" stroke="#9a8a60" stroke-width="2" />

  
  <line x1="440" y1="510" x2="660" y2="510" stroke="#8b2020" stroke-width="3" stroke-dasharray="12,6" />

  
  <ellipse cx="850" cy="400" rx="30" ry="80" fill="url(#landgrad)" stroke="#9a8a60" stroke-width="1.5" transform="rotate(-15 850 400)" />
  <ellipse cx="900" cy="500" rx="25" ry="100" fill="url(#landgrad)" stroke="#9a8a60" stroke-width="1.5" transform="rotate(-10 900 500)" />
  <ellipse cx="930" cy="620" rx="20" ry="70" fill="url(#landgrad)" stroke="#9a8a60" stroke-width="1.5" transform="rotate(-5 930 620)" />
  <ellipse cx="950" cy="710" rx="15" ry="45" fill="url(#landgrad)" stroke="#9a8a60" stroke-width="1.5" />

  
  <g transform="translate(1340,700)">
    <circle r="72" fill="#e0d4b0" stroke="#7a6a4a" stroke-width="2" />
    <circle r="60" fill="none" stroke="#7a6a4a" stroke-width="1" stroke-dasharray="4,4" />
    
    <polygon points="0,-55 8,-20 0,-30 -8,-20" fill="#5a4a30" />
    <polygon points="0,55 8,20 0,30 -8,20" fill="#9a8a60" />
    <polygon points="-55,0 -20,8 -30,0 -20,-8" fill="#9a8a60" />
    <polygon points="55,0 20,8 30,0 20,-8" fill="#9a8a60" />
    
    <text x="0" y="-62" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#3a2a10" font-weight="bold">N</text>
    <text x="0" y="74" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#5a4a30">S</text>
    <text x="-68" y="4" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#5a4a30">W</text>
    <text x="68" y="4" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#5a4a30">E</text>
    <circle r="8" fill="#7a6a4a" />
    <circle r="4" fill="#e0d4b0" />
  </g>

  
  <rect x="20" y="20" width="1496" height="984" fill="none" stroke="#7a6a4a" stroke-width="3" />
  <rect x="32" y="32" width="1472" height="960" fill="none" stroke="#7a6a4a" stroke-width="1" />

  
  <g stroke="#7a6a4a" stroke-width="1.5" fill="none">
    <path d="M20,20 L70,20 M20,20 L20,70" />
    <path d="M1516,20 L1466,20 M1516,20 L1516,70" />
    <path d="M20,1004 L70,1004 M20,1004 L20,954" />
    <path d="M1516,1004 L1466,1004 M1516,1004 L1516,954" />
  </g>

  
  <text x="545" y="450" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#f0e8d0" font-weight="bold" letter-spacing="1">DPRK</text>

  
  <text x="680" y="506" font-family="Georgia,serif" font-size="13" fill="#8b2020" font-style="italic">38°N</text>

  
  <rect x="50" y="180" width="660" height="620" rx="4" fill="#e8dfc8" opacity="0.88" stroke="#9a8a60" stroke-width="2" />
  <rect x="60" y="190" width="640" height="600" rx="2" fill="none" stroke="#c4b080" stroke-width="1" />

  
  <line x1="90" y1="240" x2="680" y2="240" stroke="#7a6a4a" stroke-width="1.5" />
  <line x1="90" y1="244" x2="680" y2="244" stroke="#7a6a4a" stroke-width="0.5" />

  
  <text x="385" y="232" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#7a6a4a" letter-spacing="4" font-style="italic">KNOWLEDGE BASE · NORTH KOREA</text>

  
  <text x="385" y="330" text-anchor="middle" font-family="Georgia,serif" font-size="96" fill="#2a1a08" font-weight="bold" letter-spacing="8">HISTORY</text>

  
  <line x1="90" y1="360" x2="680" y2="360" stroke="#7a6a4a" stroke-width="1.5" />
  <line x1="90" y1="364" x2="680" y2="364" stroke="#7a6a4a" stroke-width="0.5" />

  
  <text x="385" y="420" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#7a6a4a" letter-spacing="3">FEATURED TOPIC</text>

  
  <text x="385" y="480" text-anchor="middle" font-family="Georgia,serif" font-size="38" fill="#3a2010" font-weight="bold">The Korean War</text>
  <text x="385" y="516" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#5a3a20" font-style="italic">1950 – 1953</text>

  
  <text x="385" y="574" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#4a3a20">The war that permanently divided the peninsula</text>
  <text x="385" y="598" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#4a3a20">and became the DPRK's foundational trauma.</text>

  
  <line x1="90" y1="630" x2="680" y2="630" stroke="#7a6a4a" stroke-width="0.8" />

  
  <rect x="140" y="660" width="490" height="4" fill="#9a8a60" />
  <rect x="140" y="658" width="4" height="8" fill="#5a3a20" />
  <rect x="630" y="658" width="4" height="8" fill="#5a3a20" />
  <text x="140" y="686" font-family="Georgia,serif" font-size="14" fill="#5a4a30">June 1950</text>
  <text x="630" y="686" text-anchor="end" font-family="Georgia,serif" font-size="14" fill="#5a4a30">July 1953</text>
  <text x="385" y="686" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#7a6a4a" font-style="italic">Armistice — no peace treaty</text>

  
  <text x="385" y="756" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#9a8a60" letter-spacing="2">ATLAS OF THE KOREAN PENINSULA</text>

  
  <clipPath id="nkclip">
    <path d="M480,370 L520,360 L560,340 L590,360 L610,380 L630,400 L640,440 L650,480 L645,510 L620,510 L580,520 L540,515 L500,520 L470,510 L455,490 L460,450 L440,420 L450,390 Z" />
  </clipPath>
  <rect x="430" y="340" width="230" height="190" fill="url(#hatch)" clip-path="url(#nkclip)" />

  
  <circle cx="520" cy="455" r="6" fill="#e8dfc8" stroke="#3a2010" stroke-width="2" />
  <text x="532" y="450" font-family="Georgia,serif" font-size="11" fill="#f0e8d0" font-style="italic">Pyongyang</text>

  
  <circle cx="535" cy="525" r="5" fill="#e8dfc8" stroke="#3a2010" stroke-width="1.5" />
  <text x="547" y="520" font-family="Georgia,serif" font-size="11" fill="#3a2010" font-style="italic">Seoul</text>

</svg>