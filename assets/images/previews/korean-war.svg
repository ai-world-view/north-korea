<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Korean War — Historical Banner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c9a8" />
      <stop offset="100%" stop-color="#b8a98a" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fa8b8" />
      <stop offset="100%" stop-color="#6b8a9e" />
    </linearGradient>
    <linearGradient id="northGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a6e5a" />
      <stop offset="100%" stop-color="#6b6050" />
    </linearGradient>
    <linearGradient id="southGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a96a" />
      <stop offset="100%" stop-color="#b89850" />
    </linearGradient>
    <filter id="tex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
      <feComposite in="blend" in2="SourceGraphic" operator="in" />
    </filter>
    <linearGradient id="divLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b1a1a" stop-opacity="0" />
      <stop offset="20%" stop-color="#8b1a1a" stop-opacity="1" />
      <stop offset="80%" stop-color="#8b1a1a" stop-opacity="1" />
      <stop offset="100%" stop-color="#8b1a1a" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="overlayFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1208" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#1a1208" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1a1208" stop-opacity="0" />
    </linearGradient>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#bg)" />
  
  <rect width="1536" height="1024" fill="url(#bg)" filter="url(#tex)" opacity="0.3" />

  
  
  <ellipse cx="520" cy="560" rx="180" ry="280" fill="url(#sea)" opacity="0.7" />
  
  <ellipse cx="1080" cy="530" rx="160" ry="260" fill="url(#sea)" opacity="0.7" />
  
  <ellipse cx="800" cy="870" rx="320" ry="120" fill="url(#sea)" opacity="0.6" />

  
  <path d="M300,80 L900,80 L920,200 L880,300 L820,360 L760,390 L700,400 L650,420 L600,450 L560,460 L500,440 L440,430 L380,450 L320,480 L280,500 L240,480 L200,460 L180,400 L200,320 L220,240 L260,160 Z" fill="#c4b896" stroke="#a09070" stroke-width="1.5" />
  
  <text x="480" y="300" font-family="Georgia, serif" font-size="36" fill="#6b5a3a" opacity="0.7" text-anchor="middle" letter-spacing="4">CHINA</text>

  
  <path d="M680,390 L760,385 L800,370 L830,360 L850,370 L860,390 L870,420 L865,460 L850,490 L830,510 L800,520 L770,525 L740,520 L710,510 L690,490 L675,460 L670,430 Z" fill="url(#northGrad)" stroke="#5a4e3a" stroke-width="2" />

  
  <path d="M675,460 L690,490 L710,510 L740,520 L770,525 L800,520 L830,510 L845,530 L850,560 L840,590 L820,620 L800,650 L775,670 L750,680 L720,678 L695,665 L675,640 L660,610 L655,580 L658,550 L665,510 Z" fill="url(#southGrad)" stroke="#5a4e3a" stroke-width="2" />

  
  <line x1="440" y1="458" x2="1060" y2="458" stroke="url(#divLine)" stroke-width="3.5" stroke-dasharray="12,6" />
  
  <text x="1080" y="464" font-family="Georgia, serif" font-size="20" fill="#8b1a1a" font-style="italic">38th Parallel</text>

  
  <ellipse cx="1100" cy="430" rx="22" ry="60" fill="#c4b896" stroke="#a09070" stroke-width="1.5" transform="rotate(-15,1100,430)" />
  <ellipse cx="1130" cy="530" rx="18" ry="50" fill="#c4b896" stroke="#a09070" stroke-width="1.5" transform="rotate(-10,1130,530)" />
  <text x="1160" y="480" font-family="Georgia, serif" font-size="28" fill="#6b5a3a" opacity="0.7" letter-spacing="2">JAPAN</text>

  
  <g transform="translate(1360,200)">
    <circle cx="0" cy="0" r="60" fill="#d4c9a8" stroke="#8a7a5a" stroke-width="2" />
    <circle cx="0" cy="0" r="52" fill="none" stroke="#8a7a5a" stroke-width="1" />
    
    <polygon points="0,-48 -10,-10 0,-18 10,-10" fill="#8b1a1a" />
    
    <polygon points="0,48 -10,10 0,18 10,10" fill="#5a4e3a" />
    
    <polygon points="48,0 10,-10 18,0 10,10" fill="#5a4e3a" />
    
    <polygon points="-48,0 -10,-10 -18,0 -10,10" fill="#5a4e3a" />
    
    <text x="0" y="-54" font-family="Georgia, serif" font-size="18" fill="#8b1a1a" text-anchor="middle" font-weight="bold">N</text>
    <text x="0" y="68" font-family="Georgia, serif" font-size="16" fill="#5a4e3a" text-anchor="middle">S</text>
    <text x="58" y="5" font-family="Georgia, serif" font-size="16" fill="#5a4e3a" text-anchor="start">E</text>
    <text x="-58" y="5" font-family="Georgia, serif" font-size="16" fill="#5a4e3a" text-anchor="end">W</text>
    <circle cx="0" cy="0" r="6" fill="#8a7a5a" />
  </g>

  
  <rect x="18" y="18" width="1500" height="988" fill="none" stroke="#8a7a5a" stroke-width="3" rx="4" />
  <rect x="28" y="28" width="1480" height="968" fill="none" stroke="#8a7a5a" stroke-width="1" rx="2" />

  
  <rect x="0" y="0" width="620" height="1024" fill="url(#overlayFade)" />

  
  <g opacity="0.85">
    
    <path d="M760,400 L760,520" stroke="#8b1a1a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowS)" />
  </g>
  <defs>
    <marker id="arrowS" markerWidth="10" markerHeight="8" refX="5" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#8b1a1a" />
    </marker>
    <marker id="arrowN" markerWidth="10" markerHeight="8" refX="5" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#1a4a8b" />
    </marker>
    <marker id="arrowCN" markerWidth="10" markerHeight="8" refX="5" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#6b4a1a" />
    </marker>
  </defs>

  
  <path d="M745,520 L745,420" stroke="#1a4a8b" stroke-width="4" stroke-linecap="round" stroke-dasharray="8,4" marker-end="url(#arrowN)" />
  
  <path d="M700,395 L715,430" stroke="#6b4a1a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCN)" />

  
  <g transform="translate(870,560)">
    <rect x="0" y="0" width="200" height="90" fill="#d4c9a8" stroke="#8a7a5a" stroke-width="1.5" rx="3" opacity="0.9" />
    <line x1="12" y1="22" x2="45" y2="22" stroke="#8b1a1a" stroke-width="3" />
    <polygon points="45,18 55,22 45,26" fill="#8b1a1a" />
    <text x="62" y="27" font-family="Georgia, serif" font-size="15" fill="#3a2a1a">NK Advance</text>
    <line x1="12" y1="50" x2="45" y2="50" stroke="#1a4a8b" stroke-width="3" stroke-dasharray="6,3" />
    <polygon points="45,46 55,50 45,54" fill="#1a4a8b" />
    <text x="62" y="55" font-family="Georgia, serif" font-size="15" fill="#3a2a1a">UN Response</text>
    <line x1="12" y1="76" x2="45" y2="76" stroke="#6b4a1a" stroke-width="3" />
    <polygon points="45,72 55,76 45,80" fill="#6b4a1a" />
    <text x="62" y="81" font-family="Georgia, serif" font-size="15" fill="#3a2a1a">China Entry</text>
  </g>

  
  <rect x="60" y="820" width="420" height="44" fill="#5a4e3a" rx="2" opacity="0.85" />
  <text x="270" y="849" font-family="Georgia, serif" font-size="22" fill="#d4c9a8" text-anchor="middle" letter-spacing="2">JUNE 1950 – JULY 1953</text>

  
  <text x="80" y="680" font-family="Georgia, serif" font-size="112" fill="#1a1208" opacity="0.92" font-weight="bold" letter-spacing="-2">Korean</text>
  <text x="80" y="800" font-family="Georgia, serif" font-size="112" fill="#1a1208" opacity="0.92" font-weight="bold" letter-spacing="-2">War</text>

  
  <text x="80" y="640" font-family="Georgia, serif" font-size="26" fill="#8b1a1a" letter-spacing="6" opacity="0.9">HISTORY</text>

  
  <circle cx="740" cy="430" r="6" fill="#d4c9a8" stroke="#5a4e3a" stroke-width="1.5" />
  <text x="752" y="426" font-family="Georgia, serif" font-size="14" fill="#d4c9a8">Pyongyang</text>

  
  <circle cx="735" cy="490" r="6" fill="#8b1a1a" stroke="#d4c9a8" stroke-width="1.5" />
  <text x="747" y="486" font-family="Georgia, serif" font-size="14" fill="#d4c9a8">Seoul</text>

  
  <text x="1400" y="990" font-family="Georgia, serif" font-size="16" fill="#8a7a5a" text-anchor="end" font-style="italic">Korea, 1950–1953</text>

  
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3a3228" stroke-width="0.8" opacity="0.3" />
    </pattern>
  </defs>
  <path d="M680,390 L760,385 L800,370 L830,360 L850,370 L860,390 L870,420 L865,460 L850,490 L830,510 L800,520 L770,525 L740,520 L710,510 L690,490 L675,460 L670,430 Z" fill="url(#hatch)" />

  
  <text x="775" y="440" font-family="Georgia, serif" font-size="14" fill="#d4c9a8" text-anchor="middle" opacity="0.9" letter-spacing="1">NORTH</text>
  <text x="775" y="456" font-family="Georgia, serif" font-size="14" fill="#d4c9a8" text-anchor="middle" opacity="0.9" letter-spacing="1">KOREA</text>
  <text x="775" y="590" font-family="Georgia, serif" font-size="14" fill="#5a4e3a" text-anchor="middle" opacity="0.9" letter-spacing="1">SOUTH</text>
  <text x="775" y="606" font-family="Georgia, serif" font-size="14" fill="#5a4e3a" text-anchor="middle" opacity="0.9" letter-spacing="1">KOREA</text>

</svg>