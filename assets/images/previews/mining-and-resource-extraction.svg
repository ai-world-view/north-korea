<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Mining and Resource Extraction — DPRK Economy</title>
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dcc8" />
      <stop offset="100%" stop-color="#d4c4a0" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b7355" />
      <stop offset="40%" stop-color="#6b5a3e" />
      <stop offset="70%" stop-color="#4a3f2e" />
      <stop offset="100%" stop-color="#2c2418" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9b896" />
      <stop offset="100%" stop-color="#b8a678" />
    </linearGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#a08060" stroke-width="0.8" opacity="0.4" />
    </pattern>
    <pattern id="crosshatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#7a6040" stroke-width="0.6" opacity="0.3" />
      <line x1="0" y1="5" x2="10" y2="5" stroke="#7a6040" stroke-width="0.6" opacity="0.3" />
    </pattern>
    <filter id="engrave">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended" />
      <feComposite in="blended" in2="SourceGraphic" operator="in" />
    </filter>
    <linearGradient id="coalVein" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2520" />
      <stop offset="50%" stop-color="#1a1510" />
      <stop offset="100%" stop-color="#2a2520" />
    </linearGradient>
    <linearGradient id="mineralGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a9e7e" />
      <stop offset="100%" stop-color="#4a7a5e" />
    </linearGradient>
    <linearGradient id="uraniumGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a9e5e" />
      <stop offset="100%" stop-color="#6a7e3e" />
    </linearGradient>
    <linearGradient id="ironGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a6a5a" />
      <stop offset="100%" stop-color="#6a4a3a" />
    </linearGradient>
  </defs>

  
