<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Railways &amp; Transport – Rail, Road, Port and Air Networks of the DPRK</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#c9b98a" />
    </radialGradient>
    <radialGradient id="sea" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8aacb8" />
      <stop offset="100%" stop-color="#5e8a9a" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#b8a070" stroke-width="0.4" opacity="0.4" />
    </pattern>
    <linearGradient id="titleBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1f0e" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#2a1f0e" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#2a1f0e" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)" />
  <rect width="1536" height="1024" fill="url(#grid)" />

  <!-- East Sea -->
  <ellipse cx="1360" cy="560" rx="360" ry="620" fill="url(#sea)" opacity="0.8" />
  <text x="1420" y="360" font-family="Georgia, serif" font-size="22" fill="#3a5a6a" opacity="0.7" text-anchor="middle" letter-spacing="3" font-style="italic">EAST SEA</text>
  <text x="1420" y="388" font-family="Georgia, serif" font-size="16" fill="#3a5a6a" opacity="0.5" text-anchor="middle" letter-spacing="2" font-style="italic">(SEA OF JAPAN)</text>

  <!-- Yellow Sea (west) -->
  <ellipse cx="560" cy="900" rx="360" ry="260" fill="url(#sea)" opacity="0.55" />
  <text x="640" y="960" font-family="Georgia, serif" font-size="18" fill="#3a5a6a" opacity="0.6" text-anchor="middle" letter-spacing="2" font-style="italic">YELLOW SEA</text>

  <!-- DPRK landmass outline -->
  <path d="M 700 210 L 820 180 L 940 200 L 1030 250 L 1080 320 L 1120 380 L 1180 430 L 1210 510 L 1160 560 L 1090 600 L 1030 660 L 980 720 L 940 790 L 900 850 L 840 870 L 800 820 L 770 760 L 720 720 L 660 700 L 600 660 L 560 600 L 590 540 L 620 470 L 600 400 L 640 330 L 660 270 Z"
        fill="#c4b48a" stroke="#8a6a30" stroke-width="2.5" />

  <!-- Yalu / Tumen river borders (north) -->
  <path d="M 700 210 Q 640 260 660 330 Q 620 400 640 470" stroke="#4a7a9a" stroke-width="3.5" fill="none" opacity="0.75" />
  <text x="600" y="360" font-family="Georgia, serif" font-size="13" fill="#2a5a7a" font-style="italic" opacity="0.85" transform="rotate(70 600 360)">Yalu R.</text>
  <path d="M 940 200 Q 1000 220 1030 250" stroke="#4a7a9a" stroke-width="3" fill="none" opacity="0.75" />
  <text x="1000" y="200" font-family="Georgia, serif" font-size="13" fill="#2a5a7a" font-style="italic" opacity="0.85">Tumen R.</text>

  <!-- China (northwest) label -->
  <text x="640" y="150" font-family="Georgia, serif" font-size="24" fill="#5a4020" text-anchor="middle" letter-spacing="3" opacity="0.65">CHINA</text>

  <!-- DMZ (south) -->
  <path d="M 800 820 Q 830 830 900 850" stroke="#8a2a1a" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.7" />
  <text x="770" y="900" font-family="Georgia, serif" font-size="13" fill="#8a2a1a" opacity="0.8" font-style="italic">DMZ · to Seoul →</text>

  <!-- Main-line rail running down the spine -->
  <path d="M 700 245 Q 780 300 820 370 Q 870 430 900 500 Q 930 560 900 620 Q 870 690 840 760 Q 820 800 800 820"
        stroke="#5a3a1a" stroke-width="5" fill="none" opacity="0.9" />
  <path d="M 700 245 Q 780 300 820 370 Q 870 430 900 500 Q 930 560 900 620 Q 870 690 840 760 Q 820 800 800 820"
        stroke="#e8dfc8" stroke-width="1.6" stroke-dasharray="2,10" fill="none" opacity="0.9" />
  <!-- rail ties -->
  <g stroke="#5a3a1a" stroke-width="3" opacity="0.7">
    <line x1="740" y1="262" x2="752" y2="250" />
    <line x1="808" y1="352" x2="822" y2="344" />
    <line x1="884" y1="472" x2="898" y2="466" />
    <line x1="916" y1="596" x2="930" y2="600" />
    <line x1="856" y1="716" x2="870" y2="722" />
  </g>

  <!-- East-coast rail branch to Rajin -->
  <path d="M 900 500 Q 1000 560 1090 600 Q 1140 560 1160 510"
        stroke="#5a3a1a" stroke-width="3" stroke-dasharray="7,5" fill="none" opacity="0.7" />

  <!-- West branch rail to Nampo -->
  <path d="M 820 370 Q 720 420 660 470" stroke="#5a3a1a" stroke-width="3" stroke-dasharray="7,5" fill="none" opacity="0.6" />

  <!-- Sinuiju marker (NW border) -->
  <circle cx="700" cy="245" r="11" fill="#2a5a7a" stroke="#f0e0c0" stroke-width="2.5" />
  <circle cx="700" cy="245" r="4" fill="#f0e0c0" />
  <text x="600" y="238" font-family="Georgia, serif" font-size="15" fill="#2a1208" letter-spacing="0.5">Sinuiju</text>

  <!-- Pyongyang marker (capital, larger) -->
  <circle cx="740" cy="470" r="17" fill="#8a2a1a" stroke="#f0e0c0" stroke-width="3" />
  <circle cx="740" cy="470" r="7" fill="#f0e0c0" />
  <text x="600" y="463" font-family="Georgia, serif" font-size="19" fill="#2a1208" font-weight="bold" letter-spacing="0.5">Pyongyang</text>

  <!-- Nampo port -->
  <circle cx="655" cy="500" r="9" fill="#4a6a3a" stroke="#f0e0c0" stroke-width="2" />
  <circle cx="655" cy="500" r="3" fill="#f0e0c0" />
  <text x="545" y="520" font-family="Georgia, serif" font-size="14" fill="#2a1208">Nampo (port)</text>

  <!-- Hamhung marker -->
  <circle cx="910" cy="560" r="11" fill="#2a5a7a" stroke="#f0e0c0" stroke-width="2.5" />
  <circle cx="910" cy="560" r="4" fill="#f0e0c0" />
  <text x="932" y="556" font-family="Georgia, serif" font-size="15" fill="#2a1208" letter-spacing="0.5">Hamhung</text>

  <!-- Wonsan port -->
  <circle cx="900" cy="660" r="10" fill="#4a6a3a" stroke="#f0e0c0" stroke-width="2" />
  <circle cx="900" cy="660" r="3.5" fill="#f0e0c0" />
  <text x="922" y="665" font-family="Georgia, serif" font-size="14" fill="#2a1208">Wonsan (port)</text>

  <!-- Rajin port (NE) -->
  <circle cx="1160" cy="510" r="10" fill="#4a6a3a" stroke="#f0e0c0" stroke-width="2" />
  <circle cx="1160" cy="510" r="3.5" fill="#f0e0c0" />
  <text x="1182" y="515" font-family="Georgia, serif" font-size="14" fill="#2a1208">Rajin (port)</text>

  <!-- Compass rose -->
  <g transform="translate(1400, 830)">
    <circle cx="0" cy="0" r="55" fill="#d8c898" stroke="#8a6a30" stroke-width="1.5" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#8a6a30" stroke-width="1" />
    <polygon points="0,-50 -7,-28 7,-28" fill="#2a1208" />
    <polygon points="0,50 -7,28 7,28" fill="#8a6a30" opacity="0.5" />
    <polygon points="-50,0 -28,-7 -28,7" fill="#8a6a30" opacity="0.5" />
    <polygon points="50,0 28,-7 28,7" fill="#8a6a30" opacity="0.5" />
    <text x="0" y="-54" font-family="Georgia, serif" font-size="16" fill="#2a1208" text-anchor="middle" font-weight="bold">N</text>
    <text x="0" y="68" font-family="Georgia, serif" font-size="12" fill="#5a4020" text-anchor="middle">S</text>
    <text x="-62" y="4" font-family="Georgia, serif" font-size="12" fill="#5a4020" text-anchor="middle">W</text>
    <text x="62" y="4" font-family="Georgia, serif" font-size="12" fill="#5a4020" text-anchor="middle">E</text>
    <circle cx="0" cy="0" r="5" fill="#8a6a30" />
  </g>

  <!-- Title panel -->
  <rect x="0" y="0" width="480" height="1024" fill="url(#titleBg)" />
  <line x1="40" y1="40" x2="440" y2="40" stroke="#c8a84a" stroke-width="1.5" opacity="0.7" />
  <line x1="40" y1="44" x2="440" y2="44" stroke="#c8a84a" stroke-width="0.5" opacity="0.4" />
  <line x1="40" y1="984" x2="440" y2="984" stroke="#c8a84a" stroke-width="1.5" opacity="0.7" />
  <line x1="40" y1="980" x2="440" y2="980" stroke="#c8a84a" stroke-width="0.5" opacity="0.4" />
  <line x1="40" y1="40" x2="40" y2="984" stroke="#c8a84a" stroke-width="1.5" opacity="0.7" />
  <line x1="44" y1="40" x2="44" y2="984" stroke="#c8a84a" stroke-width="0.5" opacity="0.4" />

  <text x="240" y="110" font-family="Georgia, serif" font-size="14" fill="#c8a84a" text-anchor="middle" letter-spacing="5" opacity="0.9">DPRK · TRANSPORT NETWORK</text>
  <line x1="70" y1="130" x2="410" y2="130" stroke="#c8a84a" stroke-width="1" opacity="0.5" />

  <text x="240" y="230" font-family="Georgia, serif" font-size="64" fill="#f5e8c8" text-anchor="middle" letter-spacing="8">철도</text>
  <line x1="70" y1="255" x2="410" y2="255" stroke="#c8a84a" stroke-width="1" opacity="0.5" />
  <text x="240" y="320" font-family="Georgia, serif" font-size="52" fill="#f5e8c8" text-anchor="middle" font-weight="bold" letter-spacing="1">RAILWAYS &amp;</text>
  <text x="240" y="378" font-family="Georgia, serif" font-size="52" fill="#f5e8c8" text-anchor="middle" font-weight="bold" letter-spacing="1">TRANSPORT</text>
  <text x="240" y="425" font-family="Georgia, serif" font-size="20" fill="#c8a84a" text-anchor="middle" letter-spacing="3" font-style="italic">Rail · Road · Port · Air</text>
  <line x1="100" y1="450" x2="380" y2="450" stroke="#c8a84a" stroke-width="0.8" opacity="0.4" />

  <text x="240" y="505" font-family="Georgia, serif" font-size="17" fill="#e0cfa0" text-anchor="middle" letter-spacing="1">&#8776;5,200 km main-line track</text>
  <text x="240" y="535" font-family="Georgia, serif" font-size="17" fill="#e0cfa0" text-anchor="middle" letter-spacing="1">Port hubs: Nampo · Wonsan · Rajin</text>
  <line x1="100" y1="560" x2="380" y2="560" stroke="#c8a84a" stroke-width="0.8" opacity="0.4" />

  <!-- Locomotive / rail motif -->
  <g transform="translate(240, 660)" fill="none" stroke="#c8a84a" stroke-width="5" opacity="0.78" stroke-linecap="round" stroke-linejoin="round">
    <!-- locomotive body -->
    <path d="M -70 18 L -70 -18 L 20 -18 L 20 -40 L 55 -40 L 55 18 Z" />
    <!-- cab window -->
    <line x1="30" y1="-30" x2="46" y2="-30" stroke-width="3" />
    <!-- wheels -->
    <circle cx="-50" cy="30" r="9" />
    <circle cx="-18" cy="30" r="9" />
    <circle cx="35" cy="30" r="9" />
    <!-- rail track under wheels -->
    <line x1="-88" y1="44" x2="72" y2="44" stroke-width="3" />
    <g stroke-width="2.5">
      <line x1="-78" y1="44" x2="-84" y2="52" />
      <line x1="-40" y1="44" x2="-46" y2="52" />
      <line x1="0" y1="44" x2="-6" y2="52" />
      <line x1="40" y1="44" x2="34" y2="52" />
    </g>
  </g>

  <text x="240" y="760" font-family="Georgia, serif" font-size="15" fill="#b89a60" text-anchor="middle" letter-spacing="2">AGING SOVIET-ERA ELECTRIFIED RAIL</text>
  <text x="240" y="782" font-family="Georgia, serif" font-size="15" fill="#b89a60" text-anchor="middle" letter-spacing="2">SPARSE PAVED ROADS · LIMITED AIR</text>
  <line x1="100" y1="805" x2="380" y2="805" stroke="#c8a84a" stroke-width="0.8" opacity="0.4" />

  <text x="240" y="845" font-family="Georgia, serif" font-size="15" fill="#9a8050" text-anchor="middle" font-style="italic">Pyongyang &#8596; Sinuiju &#8596; Rajin</text>
  <text x="240" y="880" font-family="Georgia, serif" font-size="14" fill="#9a8050" text-anchor="middle" font-style="italic">Rail moves &#8776;90% of freight and passengers</text>

  <text x="240" y="950" font-family="Georgia, serif" font-size="13" fill="#c8a84a" text-anchor="middle" letter-spacing="4" opacity="0.6">ATLAS PLATE · KOREA</text>

  <!-- Scale bar -->
  <g transform="translate(1040, 960)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#5a4020" stroke-width="2" />
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#5a4020" stroke-width="2" />
    <line x1="60" y1="-4" x2="60" y2="4" stroke="#5a4020" stroke-width="1.5" />
    <line x1="120" y1="-6" x2="120" y2="6" stroke="#5a4020" stroke-width="2" />
    <rect x="0" y="-2" width="60" height="4" fill="#5a4020" />
    <rect x="60" y="-2" width="60" height="4" fill="#d8c898" />
    <text x="0" y="-12" font-family="Georgia, serif" font-size="11" fill="#3a2010" text-anchor="middle">0</text>
    <text x="60" y="-12" font-family="Georgia, serif" font-size="11" fill="#3a2010" text-anchor="middle">100</text>
    <text x="120" y="-12" font-family="Georgia, serif" font-size="11" fill="#3a2010" text-anchor="middle">200 km</text>
  </g>

  <rect x="8" y="8" width="1520" height="1008" fill="none" stroke="#8a6a30" stroke-width="3" opacity="0.5" />
  <rect x="14" y="14" width="1508" height="996" fill="none" stroke="#c8a84a" stroke-width="1" opacity="0.3" />
  <rect width="1536" height="1024" fill="#c8a050" opacity="0.04" />
</svg>
