<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Culture &amp; Society — North Korea Knowledge Base</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c9a8" />
    </linearGradient>
    <linearGradient id="mapgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b99a" />
      <stop offset="100%" stop-color="#b5a484" />
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b0a080" stroke-width="0.5" opacity="0.4" />
    </pattern>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)" />
  <rect width="1536" height="1024" fill="url(#hatch)" />

  <rect x="28" y="28" width="1480" height="968" fill="none" stroke="#8a7a5a" stroke-width="3" />
  <rect x="40" y="40" width="1456" height="944" fill="none" stroke="#8a7a5a" stroke-width="1" />

  <!-- Peninsula silhouette -->
  <g transform="translate(760, 480)">
    <path d="M-60,-200 C-55,-190 -50,-170 -45,-150 C-40,-130 -38,-110 -35,-90 C-30,-65 -25,-45 -20,-20 C-15,5 -10,30 -5,55 C0,80 5,110 8,140 C12,170 15,190 10,210 C5,225 -5,235 -15,230 C-25,225 -30,210 -35,195 C-40,180 -42,160 -38,140 C-34,120 -25,105 -20,90 C-15,75 -12,60 -15,45 C-18,30 -28,20 -40,15 C-55,10 -70,15 -80,5 C-90,-5 -90,-20 -85,-35 C-80,-50 -70,-60 -65,-80 C-60,-100 -65,-120 -65,-145 C-65,-165 -62,-185 -60,-200 Z" fill="url(#mapgrad)" stroke="#8a7a5a" stroke-width="2" />
    <path d="M-60,-200 C-55,-190 -50,-170 -45,-150 C-40,-130 -38,-110 -35,-90 C-30,-65 -25,-45 -20,-20 L-40,15 C-55,10 -70,15 -80,5 C-90,-5 -90,-20 -85,-35 C-80,-50 -70,-60 -65,-80 C-60,-100 -65,-120 -65,-145 C-65,-165 -62,-185 -60,-200 Z" fill="#a89060" stroke="#8a7a5a" stroke-width="2" />
    <line x1="-90" y1="-15" x2="-10" y2="-20" stroke="#6a5a3a" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- Compass -->
  <g transform="translate(1380, 200)">
    <circle cx="0" cy="0" r="60" fill="#d4c9a8" stroke="#8a7a5a" stroke-width="1.5" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#8a7a5a" stroke-width="0.8" />
    <polygon points="0,-55 -8,-10 0,-20 8,-10" fill="#6a5a3a" />
    <polygon points="0,-55 -8,-10 0,-20 8,-10" fill="#6a5a3a" transform="rotate(180)" />
    <polygon points="0,-55 -8,-10 0,-20 8,-10" fill="#9a8a6a" transform="rotate(90)" />
    <polygon points="0,-55 -8,-10 0,-20 8,-10" fill="#9a8a6a" transform="rotate(270)" />
    <circle cx="0" cy="0" r="5" fill="#8a7a5a" />
    <text x="0" y="-62" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#3a2a1a" font-weight="bold">N</text>
    <text x="0" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#3a2a1a">S</text>
    <text x="68" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#3a2a1a">E</text>
    <text x="-68" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#3a2a1a">W</text>
  </g>

  <!-- Star + mass-ornament motif -->
  <g transform="translate(320, 470)" opacity="0.6">
    <polygon points="0,-70 21,-22 72,-22 31,10 46,60 0,30 -46,60 -31,10 -72,-22 -21,-22" fill="#7a3030" stroke="#5a2020" stroke-width="1.5" />
    <g fill="#7a6a4a">
      <circle cx="-90" cy="90" r="14" /><circle cx="-45" cy="105" r="14" /><circle cx="0" cy="112" r="14" />
      <circle cx="45" cy="105" r="14" /><circle cx="90" cy="90" r="14" />
      <circle cx="-70" cy="140" r="12" /><circle cx="-23" cy="150" r="12" /><circle cx="23" cy="150" r="12" /><circle cx="70" cy="140" r="12" />
    </g>
  </g>

  <!-- Title plate -->
  <rect x="80" y="80" width="720" height="230" fill="#3a2a1a" opacity="0.85" rx="4" />
  <rect x="84" y="84" width="712" height="222" fill="none" stroke="#c8b080" stroke-width="1.5" rx="2" />
  <text x="440" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="74" font-weight="bold" fill="#e8d8b0" letter-spacing="3">Culture &amp; Society</text>
  <line x1="120" y1="202" x2="760" y2="202" stroke="#c8b080" stroke-width="1" opacity="0.6" />
  <text x="440" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#c8b080" font-style="italic" letter-spacing="2">North Korea Knowledge Base</text>
  <text x="440" y="284" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#a89870" letter-spacing="1">Ideology · Propaganda · Daily Life · Belief</text>

  <!-- meridian lines -->
  <g stroke="#8a7a5a" stroke-width="0.6" opacity="0.35" fill="none">
    <path d="M600,320 Q900,300 1300,330" />
    <path d="M600,400 Q900,380 1300,410" />
    <path d="M600,480 Q900,460 1300,490" />
    <path d="M600,560 Q900,540 1300,570" />
    <path d="M600,640 Q900,620 1300,650" />
    <path d="M600,720 Q900,700 1300,730" />
  </g>
  <g stroke="#8a7a5a" stroke-width="0.6" opacity="0.35" fill="none">
    <path d="M700,300 Q710,530 700,760" />
    <path d="M820,300 Q830,530 820,760" />
    <path d="M940,300 Q950,530 940,760" />
    <path d="M1060,300 Q1070,530 1060,760" />
    <path d="M1180,300 Q1190,530 1180,760" />
  </g>

  <text x="768" y="970" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#6a5a3a" letter-spacing="3" opacity="0.7">DPRK · KOREAN PENINSULA · EAST ASIA</text>
</svg>
