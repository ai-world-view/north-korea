<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Rason – Special Economic Zone at the DPRK–China–Russia Tri-Border</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#c9b98a" />
    </radialGradient>
    <radialGradient id="sea" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8aacb8" />
      <stop offset="100%" stop-color="#5e8a9a" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#b8a070" stroke-width="0.4" opacity="0.4" />
    </pattern>
    <linearGradient id="titleBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1f0e" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#2a1f0e" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#2a1f0e" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)" />
  <rect width="1536" height="1024" fill="url(#grid)" />

  <!-- East Sea -->
  <ellipse cx="1300" cy="620" rx="560" ry="520" fill="url(#sea)" opacity="0.85" />
  <text x="1360" y="480" font-family="Georgia, serif" font-size="22" fill="#3a5a6a" opacity="0.7" text-anchor="middle" letter-spacing="3" font-style="italic">EAST SEA</text>
  <text x="1360" y="508" font-family="Georgia, serif" font-size="16" fill="#3a5a6a" opacity="0.5" text-anchor="middle" letter-spacing="2" font-style="italic">(SEA OF JAPAN)</text>

  <!-- Russia (north) landmass -->
  <path d="M 560 40 L 1100 40 L 1100 160 Q 1000 200 900 210 L 820 250 L 760 300 L 560 300 Z" fill="#cdbd90" stroke="#8a6a30" stroke-width="2" />
  <text x="820" y="120" font-family="Georgia, serif" font-size="26" fill="#5a4020" text-anchor="middle" letter-spacing="4" opacity="0.7">RUSSIA</text>
  <text x="1010" y="185" font-family="Georgia, serif" font-size="13" fill="#3a2810" opacity="0.8">Khasan · Vladivostok →</text>

  <!-- China (west) landmass -->
  <path d="M 560 300 L 760 300 L 730 380 L 690 460 L 640 540 L 560 600 L 560 300 Z" fill="#d2c295" stroke="#8a6a30" stroke-width="2" />
  <text x="620" y="420" font-family="Georgia, serif" font-size="24" fill="#5a4020" text-anchor="middle" letter-spacing="3" opacity="0.7" transform="rotate(-40 620 420)">CHINA</text>
  <text x="600" y="500" font-family="Georgia, serif" font-size="13" fill="#3a2810" opacity="0.8">Jilin · Hunchun</text>

  <!-- DPRK (Rason) peninsula tongue -->
  <path d="M 760 300 L 900 320 L 970 380 L 1000 460 L 980 540 L 920 600 L 840 640 L 760 660 L 700 620 L 690 540 L 720 460 L 730 380 Z" fill="#c4b48a" stroke="#8a6a30" stroke-width="2.5" />

  <!-- Tumen River border (Russia/China ↔ DPRK) -->
  <path d="M 760 300 Q 820 340 900 320 Q 960 355 990 420" stroke="#4a7a9a" stroke-width="4" fill="none" opacity="0.8" />
  <text x="905" y="300" font-family="Georgia, serif" font-size="13" fill="#2a5a7a" font-style="italic" opacity="0.85">Tumen R.</text>

  <!-- Rason marker -->
  <circle cx="860" cy="470" r="18" fill="#8a2a1a" stroke="#f0e0c0" stroke-width="3" />
  <circle cx="860" cy="470" r="8" fill="#f0e0c0" />
  <text x="888" y="458" font-family="Georgia, serif" font-size="20" fill="#2a1208" font-weight="bold" letter-spacing="1">라선</text>
  <text x="888" y="480" font-family="Georgia, serif" font-size="17" fill="#2a1208" font-weight="bold" letter-spacing="0.5">RASON</text>

  <!-- Rajin port marker -->
  <circle cx="905" cy="540" r="10" fill="#2a5a7a" stroke="#f0e0c0" stroke-width="2" />
  <circle cx="905" cy="540" r="4" fill="#f0e0c0" />
  <text x="920" y="545" font-family="Georgia, serif" font-size="13" fill="#2a1208" letter-spacing="0.5">Rajin Port (ice-free)</text>

  <!-- Sonbong marker -->
  <circle cx="820" cy="410" r="8" fill="#4a6a3a" stroke="#f0e0c0" stroke-width="2" />
  <circle cx="820" cy="410" r="3" fill="#f0e0c0" />
  <text x="740" y="405" font-family="Georgia, serif" font-size="13" fill="#2a1208">Sŏnbong</text>

  <!-- Rajin–Khasan rail -->
  <path d="M 862 470 Q 830 400 800 320 Q 790 300 770 300" stroke="#5a3a1a" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.7" />
  <text x="700" y="350" font-family="Georgia, serif" font-size="11" fill="#5a3a1a" font-style="italic" opacity="0.8">Rajin–Khasan rail</text>

  <!-- Compass rose -->
  <g transform="translate(1400, 830)">
    <circle cx="0" cy="0" r="55" fill="#d8c898" stroke="#8a6a30" stroke-width="1.5" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#8a6a30" stroke-width="1" />
    <polygon points="0,-50 -7,-28 7,-28" fill="#2a1208" />
    <polygon points="0,50 -7,28 7,28" fill="#8a6a30" opacity="0.5" />
    <polygon points="-50,0 -28,-7 -28,7" fill="#8a6a30" opacity="0.5" />
    <polygon points="50,0 28,-7 28,7" fill="#8a6a30" opacity="0.5" />
    <text x="0" y="-54" font-family="Georgia, serif" font-size="16" fill="#2a1208" text-anchor="middle" font-weight="bold">N</text>
    <text x="0" y="68" font-family="Georgia, serif" font-size="12" fill="#5a4020" text-anchor="middle">S</text>
    <text x="-62" y="4" font-family="Georgia, serif" font-size="12" fill="#5a4020" text-anchor="middle">W</text>
    <text x="62" y="4" font-family="Georgia, serif" font-size="12" fill="#5a4020" text-anchor="middle">E</text>
    <circle cx="0" cy="0" r="5" fill="#8a6a30" />
  </g>

  <!-- Title panel -->
  <rect x="0" y="0" width="480" height="1024" fill="url(#titleBg)" />
  <line x1="40" y1="40" x2="440" y2="40" stroke="#c8a84a" stroke-width="1.5" opacity="0.7" />
  <line x1="40" y1="44" x2="440" y2="44" stroke="#c8a84a" stroke-width="0.5" opacity="0.4" />
  <line x1="40" y1="984" x2="440" y2="984" stroke="#c8a84a" stroke-width="1.5" opacity="0.7" />
  <line x1="40" y1="980" x2="440" y2="980" stroke="#c8a84a" stroke-width="0.5" opacity="0.4" />
  <line x1="40" y1="40" x2="40" y2="984" stroke="#c8a84a" stroke-width="1.5" opacity="0.7" />
  <line x1="44" y1="40" x2="44" y2="984" stroke="#c8a84a" stroke-width="0.5" opacity="0.4" />

  <text x="240" y="110" font-family="Georgia, serif" font-size="14" fill="#c8a84a" text-anchor="middle" letter-spacing="5" opacity="0.9">DPRK · NORTHEAST TRI-BORDER</text>
  <line x1="70" y1="130" x2="410" y2="130" stroke="#c8a84a" stroke-width="1" opacity="0.5" />

  <text x="240" y="230" font-family="Georgia, serif" font-size="64" fill="#f5e8c8" text-anchor="middle" letter-spacing="8">라선</text>
  <line x1="70" y1="255" x2="410" y2="255" stroke="#c8a84a" stroke-width="1" opacity="0.5" />
  <text x="240" y="330" font-family="Georgia, serif" font-size="68" fill="#f5e8c8" text-anchor="middle" font-weight="bold" letter-spacing="2">RASON</text>
  <text x="240" y="385" font-family="Georgia, serif" font-size="20" fill="#c8a84a" text-anchor="middle" letter-spacing="3" font-style="italic">North Hamgyong Province</text>
  <line x1="100" y1="410" x2="380" y2="410" stroke="#c8a84a" stroke-width="0.8" opacity="0.4" />

  <text x="240" y="470" font-family="Georgia, serif" font-size="17" fill="#e0cfa0" text-anchor="middle" letter-spacing="1">Special economic zone (1991)</text>
  <text x="240" y="500" font-family="Georgia, serif" font-size="17" fill="#e0cfa0" text-anchor="middle" letter-spacing="1">Population: ~200,000 · ~470 km²</text>
  <line x1="100" y1="525" x2="380" y2="525" stroke="#c8a84a" stroke-width="0.8" opacity="0.4" />

  <!-- Anchor / gateway motif -->
  <g transform="translate(240, 640)" fill="none" stroke="#c8a84a" stroke-width="6" opacity="0.75" stroke-linecap="round">
    <circle cx="0" cy="-42" r="10" />
    <line x1="0" y1="-32" x2="0" y2="46" />
    <line x1="-30" y1="-14" x2="30" y2="-14" />
    <path d="M -42 20 Q -42 52 0 52 Q 42 52 42 20" />
  </g>

  <text x="240" y="730" font-family="Georgia, serif" font-size="15" fill="#b89a60" text-anchor="middle" letter-spacing="2">FIRST DPRK FREE-TRADE ZONE</text>
  <text x="240" y="752" font-family="Georgia, serif" font-size="15" fill="#b89a60" text-anchor="middle" letter-spacing="2">RAJIN–KHASAN RAIL · CHINA PIER LEASE</text>
  <line x1="100" y1="775" x2="380" y2="775" stroke="#c8a84a" stroke-width="0.8" opacity="0.4" />

  <text x="240" y="815" font-family="Georgia, serif" font-size="15" fill="#9a8050" text-anchor="middle" font-style="italic">42.30°N · 130.35°E</text>
  <text x="240" y="855" font-family="Georgia, serif" font-size="14" fill="#9a8050" text-anchor="middle" font-style="italic">Where Korea meets Russia and China</text>

  <text x="240" y="950" font-family="Georgia, serif" font-size="13" fill="#c8a84a" text-anchor="middle" letter-spacing="4" opacity="0.6">ATLAS PLATE · KOREA</text>

  <!-- Scale bar -->
  <g transform="translate(1040, 960)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#5a4020" stroke-width="2" />
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#5a4020" stroke-width="2" />
    <line x1="60" y1="-4" x2="60" y2="4" stroke="#5a4020" stroke-width="1.5" />
    <line x1="120" y1="-6" x2="120" y2="6" stroke="#5a4020" stroke-width="2" />
    <rect x="0" y="-2" width="60" height="4" fill="#5a4020" />
    <rect x="60" y="-2" width="60" height="4" fill="#d8c898" />
    <text x="0" y="-12" font-family="Georgia, serif" font-size="11" fill="#3a2010" text-anchor="middle">0</text>
    <text x="60" y="-12" font-family="Georgia, serif" font-size="11" fill="#3a2010" text-anchor="middle">25</text>
    <text x="120" y="-12" font-family="Georgia, serif" font-size="11" fill="#3a2010" text-anchor="middle">50 km</text>
  </g>

  <rect x="8" y="8" width="1520" height="1008" fill="none" stroke="#8a6a30" stroke-width="3" opacity="0.5" />
  <rect x="14" y="14" width="1508" height="996" fill="none" stroke="#c8a84a" stroke-width="1" opacity="0.3" />
  <rect width="1536" height="1024" fill="#c8a050" opacity="0.04" />
</svg>
