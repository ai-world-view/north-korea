<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Kim Jong-un — Third Supreme Leader of the DPRK</title>
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c9a8" />
    </linearGradient>
    <radialGradient id="portrait" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#cabf98" />
      <stop offset="100%" stop-color="#a8996c" />
    </radialGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9a8a6a" stroke-width="0.4" stroke-opacity="0.3" />
    </pattern>
    <filter id="engrave" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.0" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="url(#parchment)" />
  <rect width="1536" height="1024" fill="url(#hatch)" />

  <rect x="18" y="18" width="1500" height="988" fill="none" stroke="#7a6540" stroke-width="3" opacity="0.7" />
  <rect x="28" y="28" width="1480" height="968" fill="none" stroke="#7a6540" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.5" />

  <!-- Portrait medallion -->
  <g transform="translate(1080, 470)" filter="url(#engrave)">
    <circle cx="0" cy="0" r="270" fill="none" stroke="#8a7550" stroke-width="2" opacity="0.6" />
    <circle cx="0" cy="0" r="250" fill="url(#portrait)" stroke="#8a7550" stroke-width="3" />
    <!-- head/shoulders silhouette -->
    <g fill="#5a4a2e">
      <path d="M -150,250 C -150,120 -95,70 0,70 C 95,70 150,120 150,250 Z" />
      <circle cx="0" cy="-30" r="98" />
      <!-- swept hair -->
      <path d="M -98,-40 C -100,-120 -55,-150 0,-150 C 60,-150 102,-118 100,-38 C 78,-96 60,-104 40,-100 C 20,-96 8,-84 -4,-84 C -40,-84 -70,-100 -98,-40 Z" fill="#3a2e18" />
    </g>
    <!-- lapel pin -->
    <circle cx="46" cy="150" r="14" fill="#c0392b" stroke="#8b1a1a" stroke-width="2" />
    <circle cx="46" cy="150" r="5" fill="#e8c0b0" />
    <!-- radiating rule marks -->
    <g stroke="#8a7550" stroke-width="1" opacity="0.4">
      <line x1="0" y1="-270" x2="0" y2="-255" />
      <line x1="0" y1="270" x2="0" y2="255" />
      <line x1="270" y1="0" x2="255" y2="0" />
      <line x1="-270" y1="0" x2="-255" y2="0" />
      <line x1="191" y1="-191" x2="180" y2="-180" />
      <line x1="-191" y1="-191" x2="-180" y2="-180" />
      <line x1="191" y1="191" x2="180" y2="180" />
      <line x1="-191" y1="191" x2="-180" y2="180" />
    </g>
  </g>

  <!-- Title block -->
  <rect x="80" y="90" width="620" height="250" fill="#3a2a1a" opacity="0.88" rx="4" />
  <rect x="84" y="94" width="612" height="242" fill="none" stroke="#c8b080" stroke-width="1.5" rx="2" />
  <text x="108" y="185" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#e8d8b0" letter-spacing="3">Kim Jong-un</text>
  <line x1="108" y1="208" x2="668" y2="208" stroke="#c8b080" stroke-width="1" opacity="0.6" />
  <text x="108" y="252" font-family="Georgia, serif" font-size="24" fill="#c8b080" font-style="italic" letter-spacing="1">Third Supreme Leader of the DPRK</text>
  <text x="108" y="296" font-family="Georgia, serif" font-size="19" fill="#a89870" letter-spacing="1">In power: December 2011 – present</text>

  <!-- Fact card -->
  <g transform="translate(108, 470)">
    <rect x="0" y="0" width="120" height="34" fill="#7a6540" rx="3" />
    <text x="12" y="23" font-family="Georgia, serif" font-size="15" fill="#e8dfc8" letter-spacing="2">PEOPLE</text>
    <text x="0" y="74" font-family="Georgia, serif" font-size="18" fill="#3a2810" font-weight="bold">Born:</text>
    <text x="0" y="98" font-family="Georgia, serif" font-size="16" fill="#5a4030" font-style="italic">c. 8 January 1984 · Pyongyang</text>
    <text x="0" y="138" font-family="Georgia, serif" font-size="18" fill="#3a2810" font-weight="bold">Lineage:</text>
    <text x="0" y="162" font-family="Georgia, serif" font-size="16" fill="#5a4030" font-style="italic">Son of Kim Jong-il · grandson of Kim Il-sung</text>
    <text x="0" y="204" font-family="Georgia, serif" font-size="16" fill="#5a4030" font-style="italic" opacity="0.75">"The Paektu bloodline, third generation"</text>
  </g>

  <text x="1400" y="980" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#8a7550" font-style="italic" opacity="0.6">Atlas Plate · DPRK · Korean Peninsula</text>

  <g stroke="#8a7550" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 45,45 L 80,45 L 80,50 M 45,45 L 45,80 L 50,80" />
    <path d="M 1491,45 L 1456,45 L 1456,50 M 1491,45 L 1491,80 L 1486,80" />
    <path d="M 45,979 L 80,979 L 80,974 M 45,979 L 45,944 L 50,944" />
    <path d="M 1491,979 L 1456,979 L 1456,974 M 1491,979 L 1491,944 L 1486,944" />
  </g>
  <rect x="0" y="0" width="1536" height="1024" fill="none" stroke="#5a4030" stroke-width="8" opacity="0.15" />
</svg>
