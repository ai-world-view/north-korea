<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Kwanliso — North Korea's Political Prison Camp System</title>
  <defs>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5dcc4" />
      <stop offset="55%" stop-color="#d6cba8" />
      <stop offset="100%" stop-color="#bdb086" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="#00000000" />
      <stop offset="100%" stop-color="#00000066" />
    </radialGradient>
    <linearGradient id="landgrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b0a37c" />
      <stop offset="100%" stop-color="#948863" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#a89a70" stroke-width="0.5" opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1536" height="1024" fill="url(#parchment)" />
  <rect width="1536" height="1024" fill="url(#grid)" />

  <!-- Sea -->
  <ellipse cx="1180" cy="520" rx="420" ry="470" fill="#a8bfc4" opacity="0.5" />
  <text x="1320" y="360" font-family="Georgia, serif" font-size="16" fill="#4a6870" text-anchor="middle" font-style="italic" opacity="0.7" letter-spacing="2">Sea of Japan</text>

  <!-- Northern DPRK landmass -->
  <path d="M 700 130 L 820 150 L 940 140 L 1040 180 L 1110 250 L 1130 330 L 1110 410 L 1130 490 L 1110 560 L 1070 620 L 1010 660 L 950 700 L 900 740 L 860 780 L 820 800 L 790 770 L 800 710 L 770 660 L 740 600 L 720 540 L 710 470 L 700 400 L 690 330 L 700 260 L 690 190 L 700 130 Z" fill="url(#landgrad)" stroke="#6b5f3e" stroke-width="2" />

  <!-- China border label -->
  <text x="640" y="300" font-family="Georgia, serif" font-size="17" fill="#4a3825" text-anchor="middle" font-style="italic" opacity="0.75">China</text>
  <text x="920" y="720" font-family="Georgia, serif" font-size="15" fill="#e8dfc8" text-anchor="middle" font-weight="bold" opacity="0.85">DPRK</text>

  <!-- Camp markers: barbed-wire star icons -->
  <g font-family="Georgia, serif" font-size="14" fill="#2a1208">
    <g transform="translate(900,300)">
      <rect x="-9" y="-9" width="18" height="18" fill="#7b241c" stroke="#3a1208" stroke-width="1.5" transform="rotate(45)" />
      <text x="16" y="5">Camp 16 · Hwasong</text>
    </g>
    <g transform="translate(960,420)">
      <rect x="-9" y="-9" width="18" height="18" fill="#7b241c" stroke="#3a1208" stroke-width="1.5" transform="rotate(45)" />
      <text x="16" y="5">Camp 25 · Chongjin</text>
    </g>
    <g transform="translate(850,470)">
      <rect x="-9" y="-9" width="18" height="18" fill="#7b241c" stroke="#3a1208" stroke-width="1.5" transform="rotate(45)" />
      <text x="16" y="5">Camp 15 · Yodok</text>
    </g>
    <g transform="translate(790,560)">
      <rect x="-9" y="-9" width="18" height="18" fill="#7b241c" stroke="#3a1208" stroke-width="1.5" transform="rotate(45)" />
      <text x="-150" y="5">Camp 14 · Kaechon</text>
    </g>
    <g transform="translate(840,620)">
      <rect x="-9" y="-9" width="18" height="18" fill="#7b241c" stroke="#3a1208" stroke-width="1.5" transform="rotate(45)" />
      <text x="16" y="5">Camp 18 · Bukchang</text>
    </g>
    <!-- Pyongyang for reference -->
    <g transform="translate(770,640)">
      <circle cx="0" cy="0" r="7" fill="#4a3a8a" stroke="#f0e0c0" stroke-width="1.5" />
      <text x="-96" y="26" font-style="italic" opacity="0.8">Pyongyang ★</text>
    </g>
  </g>

  <!-- Barbed-wire motif across the map -->
  <g stroke="#5a4030" stroke-width="1.5" opacity="0.5">
    <line x1="700" y1="860" x2="1100" y2="860" />
    <line x1="740" y1="854" x2="748" y2="866" /><line x1="748" y1="854" x2="740" y2="866" />
    <line x1="840" y1="854" x2="848" y2="866" /><line x1="848" y1="854" x2="840" y2="866" />
    <line x1="940" y1="854" x2="948" y2="866" /><line x1="948" y1="854" x2="940" y2="866" />
    <line x1="1040" y1="854" x2="1048" y2="866" /><line x1="1048" y1="854" x2="1040" y2="866" />
  </g>

  <!-- Left title panel -->
  <rect x="60" y="110" width="560" height="300" rx="6" fill="#241a0e" opacity="0.85" />
  <rect x="64" y="114" width="552" height="292" rx="4" fill="none" stroke="#7a6840" stroke-width="1.5" opacity="0.6" />
  <text x="340" y="180" font-family="Georgia, serif" font-size="22" fill="#c9bc98" text-anchor="middle" letter-spacing="6" opacity="0.85">NORTH KOREA</text>
  <text x="340" y="258" font-family="Georgia, serif" font-size="70" fill="#e8dfc8" text-anchor="middle" font-weight="bold" letter-spacing="4">관리소</text>
  <line x1="110" y1="286" x2="570" y2="286" stroke="#7a6840" stroke-width="1" opacity="0.7" />
  <text x="340" y="336" font-family="Georgia, serif" font-size="40" fill="#e8dfc8" text-anchor="middle" font-weight="bold" letter-spacing="1">Kwanliso</text>
  <text x="340" y="380" font-family="Georgia, serif" font-size="22" fill="#c8b080" text-anchor="middle" font-style="italic" letter-spacing="1">Political Prison Camps</text>

  <!-- Category chip + fact card -->
  <g transform="translate(90, 470)">
    <rect x="0" y="0" width="210" height="34" fill="#7a6540" rx="3" />
    <text x="12" y="23" font-family="Georgia, serif" font-size="15" fill="#e8dfc8" letter-spacing="2">CULTURE &amp; SOCIETY</text>
    <text x="0" y="80" font-family="Georgia, serif" font-size="18" fill="#3a2810" font-weight="bold">Detainees:</text>
    <text x="0" y="106" font-family="Georgia, serif" font-size="16" fill="#5a4030" font-style="italic">est. 80,000–120,000 (mid-2020s)</text>
    <text x="0" y="150" font-family="Georgia, serif" font-size="18" fill="#3a2810" font-weight="bold">Doctrine:</text>
    <text x="0" y="176" font-family="Georgia, serif" font-size="16" fill="#5a4030" font-style="italic">songbun status · three-generation guilt</text>
    <text x="0" y="220" font-family="Georgia, serif" font-size="18" fill="#3a2810" font-weight="bold">Finding:</text>
    <text x="0" y="246" font-family="Georgia, serif" font-size="16" fill="#5a4030" font-style="italic">UN 2014 — crimes against humanity</text>
  </g>

  <!-- Compass -->
  <g transform="translate(1400, 820)">
    <circle cx="0" cy="0" r="52" fill="#d6cba8" stroke="#7a6840" stroke-width="1.5" />
    <polygon points="0,-46 -7,-26 7,-26" fill="#3a2a15" />
    <polygon points="0,46 -7,26 7,26" fill="#7a6840" opacity="0.5" />
    <text x="0" y="-50" font-family="Georgia, serif" font-size="15" fill="#3a2a15" text-anchor="middle" font-weight="bold">N</text>
    <circle cx="0" cy="0" r="4" fill="#7a6840" />
  </g>

  <rect width="1536" height="1024" fill="url(#vignette)" />
  <rect x="24" y="24" width="1488" height="976" fill="none" stroke="#6b5f3e" stroke-width="3" rx="4" opacity="0.6" />
  <rect x="34" y="34" width="1468" height="956" fill="none" stroke="#c8a84a" stroke-width="1" rx="3" opacity="0.35" />
  <text x="1400" y="970" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#6b5f3e" font-style="italic" opacity="0.6">Atlas Plate · DPRK · Korean Peninsula</text>
</svg>
