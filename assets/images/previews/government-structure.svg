<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Government Structure — DPRK Atlas Plate</title>
  <defs>
    
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc0" />
      <stop offset="50%" stop-color="#ddd0a8" />
      <stop offset="100%" stop-color="#c9bc90" />
    </linearGradient>
    
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#00000000" />
      <stop offset="100%" stop-color="#3a2a1055" />
    </radialGradient>
    
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8cdd8" />
      <stop offset="100%" stop-color="#9ab5c4" />
    </linearGradient>
    
    <linearGradient id="landGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b97a" />
      <stop offset="100%" stop-color="#b5a362" />
    </linearGradient>
    
    <linearGradient id="dprkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b3a3a" />
      <stop offset="100%" stop-color="#6b2a2a" />
    </linearGradient>
    
    <pattern id="hatch" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#8a7545" stroke-width="0.4" opacity="0.3" />
    </pattern>
    <pattern id="crosshatch" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#6b5a2a" stroke-width="0.5" opacity="0.25" />
      <line x1="6" y1="0" x2="0" y2="6" stroke="#6b5a2a" stroke-width="0.5" opacity="0.25" />
    </pattern>
    
    <pattern id="seahatch" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <line x1="0" y1="0" x2="8" y2="0" stroke="#6a8ea0" stroke-width="0.5" opacity="0.4" />
    </pattern>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3a2500" flood-opacity="0.35" />
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#1a0e00" flood-opacity="0.5" />
    </filter>
  </defs>

  
