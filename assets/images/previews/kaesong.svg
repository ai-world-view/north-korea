<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Kaesong — Medieval Goryeo Capital and DMZ Border City</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#c9b98a" />
    </radialGradient>
    <radialGradient id="sea" cx="40%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#8aacb8" />
      <stop offset="100%" stop-color="#5e8a9a" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#b8a070" stroke-width="0.4" opacity="0.4" />
    </pattern>
    <linearGradient id="titleBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1f0e" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#2a1f0e" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#2a1f0e" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)" />
  <rect width="1536" height="1024" fill="url(#grid)" />

  <!-- Korea Bay / Yellow Sea to the west -->
  <ellipse cx="720" cy="520" rx="320" ry="460" fill="url(#sea)" opacity="0.8" />
  <text x="720" y="760" font-family="Georgia, serif" font-size="20" fill="#3a5a6a" opacity="0.65" text-anchor="middle" letter-spacing="2" font-style="italic">YELLOW SEA</text>

  <!-- Landmass (southern DPRK / western corridor) -->
  <path d="M 900 120 L 1000 160 L 1080 150 L 1160 190 L 1220 260 L 1240 340 L 1230 420 L 1250 500 L 1240 580 L 1210 650 L 1160 710 L 1120 760 L 1080 820 L 1040 880 L 1000 860 L 980 800 L 990 740 L 960 690 L 930 640 L 910 580 L 900 520 L 890 460 L 900 400 L 910 340 L 900 280 L 890 220 L 900 120 Z" fill="#c4b48a" stroke="#8a6a30" stroke-width="2" />

  <!-- DMZ line running east-west just south of the city -->
  <path d="M 900 640 Q 990 620 1080 630 Q 1160 638 1240 620" stroke="#8a3a2a" stroke-width="3" stroke-dasharray="8,5" fill="none" opacity="0.75" />
  <text x="1090" y="612" font-family="Georgia, serif" font-size="15" fill="#8a3a2a" text-anchor="middle" opacity="0.85" letter-spacing="2">DMZ · 38°N ARMISTICE LINE</text>

  <!-- Kaesong marker (north of the DMZ) -->
  <circle cx="1010" cy="560" r="18" fill="#8a2a1a" stroke="#f0e0c0" stroke-width="3" />
  <circle cx="1010" cy="560" r="8" fill="#f0e0c0" />
  <text x="1038" y="548" font-family="Georgia, serif" font-size="20" fill="#2a1208" font-weight="bold" letter-spacing="1">개성</text>
  <text x="1038" y="570" font-family="Georgia, serif" font-size="17" fill="#2a1208" font-weight="bold" letter-spacing="0.5">KAESONG</text>

  <!-- Industrial complex marker -->
  <circle cx="1050" cy="600" r="11" fill="#4a6a3a" stroke="#f0e0c0" stroke-width="2" />
  <circle cx="1050" cy="600" r="5" fill="#f0e0c0" />
  <text x="1066" y="605" font-family="Georgia, serif" font-size="13" fill="#2a1208">Kaesong Industrial Complex</text>

  <!-- Pyongyang to the north -->
  <circle cx="960" cy="300" r="12" fill="#4a3a8a" stroke="#f0e0c0" stroke-width="2" />
  <circle cx="960" cy="300" r="5" fill="#f0e0c0" />
  <text x="978" y="305" font-family="Georgia, serif" font-size="13" fill="#2a1208">Pyongyang ★</text>

  <!-- Seoul to the south (context) -->
  <circle cx="1090" cy="720" r="10" fill="#5a5a5a" stroke="#f0e0c0" stroke-width="2" />
  <text x="1106" y="725" font-family="Georgia, serif" font-size="12" fill="#5a4020" font-style="italic">Seoul (ROK)</text>

  <!-- roads -->
  <path d="M 970 312 Q 990 430 1008 542" stroke="#5a3a1a" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.6" />

  <!-- Compass rose -->
  <g transform="translate(1380, 800)">
    <circle cx="0" cy="0" r="55" fill="#d8c898" stroke="#8a6a30" stroke-width="1.5" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#8a6a30" stroke-width="1" />
    <polygon points="0,-50 -7,-28 7,-28" fill="#2a1208" />
    <polygon points="0,50 -7,28 7,28" fill="#8a6a30" opacity="0.5" />
    <polygon points="-50,0 -28,-7 -28,7" fill="#8a6a30" opacity="0.5" />
    <polygon points="50,0 28,-7 28,7" fill="#8a6a30" opacity="0.5" />
    <text x="0" y="-54" font-family="Georgia, serif" font-size="16" fill="#2a1208" text-anchor="middle" font-weight="bold">N</text>
    <circle cx="0" cy="0" r="5" fill="#8a6a30" />
  </g>

  <!-- Left title panel -->
  <rect x="0" y="0" width="480" height="1024" fill="url(#titleBg)" />
  <line x1="40" y1="40" x2="440" y2="40" stroke="#c8a84a" stroke-width="1.5" opacity="0.7" />
  <line x1="40" y1="984" x2="440" y2="984" stroke="#c8a84a" stroke-width="1.5" opacity="0.7" />
  <line x1="40" y1="40" x2="40" y2="984" stroke="#c8a84a" stroke-width="1.5" opacity="0.7" />

  <text x="240" y="110" font-family="Georgia, serif" font-size="14" fill="#c8a84a" text-anchor="middle" letter-spacing="5" opacity="0.9">DPRK · WESTERN BORDER</text>
  <line x1="70" y1="130" x2="410" y2="130" stroke="#c8a84a" stroke-width="1" opacity="0.5" />

  <text x="240" y="230" font-family="Georgia, serif" font-size="64" fill="#f5e8c8" text-anchor="middle" letter-spacing="8">개성</text>
  <line x1="70" y1="255" x2="410" y2="255" stroke="#c8a84a" stroke-width="1" opacity="0.5" />
  <text x="240" y="330" font-family="Georgia, serif" font-size="68" fill="#f5e8c8" text-anchor="middle" font-weight="bold" letter-spacing="2">KAESONG</text>
  <text x="240" y="385" font-family="Georgia, serif" font-size="20" fill="#c8a84a" text-anchor="middle" letter-spacing="3" font-style="italic">North Hwanghae Province</text>
  <line x1="100" y1="410" x2="380" y2="410" stroke="#c8a84a" stroke-width="0.8" opacity="0.4" />

  <text x="240" y="470" font-family="Georgia, serif" font-size="17" fill="#e0cfa0" text-anchor="middle" letter-spacing="1">Medieval capital of Goryeo (918–1392)</text>
  <text x="240" y="500" font-family="Georgia, serif" font-size="17" fill="#e0cfa0" text-anchor="middle" letter-spacing="1">Population: ~300,000</text>
  <line x1="100" y1="525" x2="380" y2="525" stroke="#c8a84a" stroke-width="0.8" opacity="0.4" />

  <text x="240" y="600" font-family="Georgia, serif" font-size="15" fill="#b89a60" text-anchor="middle" letter-spacing="2">UNESCO WORLD HERITAGE ·</text>
  <text x="240" y="622" font-family="Georgia, serif" font-size="15" fill="#b89a60" text-anchor="middle" letter-spacing="2">INTER-KOREAN INDUSTRIAL ZONE</text>
  <line x1="100" y1="648" x2="380" y2="648" stroke="#c8a84a" stroke-width="0.8" opacity="0.4" />

  <text x="240" y="700" font-family="Georgia, serif" font-size="15" fill="#9a8050" text-anchor="middle" font-style="italic">37.97°N · 126.55°E</text>
  <text x="240" y="740" font-family="Georgia, serif" font-size="14" fill="#9a8050" text-anchor="middle" font-style="italic">~10 km north of the DMZ · ~65 km to Seoul</text>

  <text x="240" y="950" font-family="Georgia, serif" font-size="13" fill="#c8a84a" text-anchor="middle" letter-spacing="4" opacity="0.6">ATLAS PLATE · KOREA</text>

  <!-- Scale bar -->
  <g transform="translate(950, 940)">
    <rect x="0" y="-2" width="60" height="4" fill="#5a4020" />
    <rect x="60" y="-2" width="60" height="4" fill="#d8c898" />
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#5a4020" stroke-width="2" />
    <line x1="120" y1="-6" x2="120" y2="6" stroke="#5a4020" stroke-width="2" />
    <text x="0" y="-12" font-family="Georgia, serif" font-size="11" fill="#3a2010" text-anchor="middle">0</text>
    <text x="120" y="-12" font-family="Georgia, serif" font-size="11" fill="#3a2010" text-anchor="middle">100 km</text>
  </g>

  <rect x="8" y="8" width="1520" height="1008" fill="none" stroke="#8a6a30" stroke-width="3" opacity="0.5" />
  <rect x="14" y="14" width="1508" height="996" fill="none" stroke="#c8a84a" stroke-width="1" opacity="0.3" />
  <rect width="1536" height="1024" fill="#c8a050" opacity="0.04" />
</svg>
