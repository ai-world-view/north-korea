<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Mount Paektu — Sacred Volcano of the Korean Peninsula</title>
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c9a8" />
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cdd9dc" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#e8dfc8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="slope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6ecec" />
      <stop offset="30%" stop-color="#c8b98a" />
      <stop offset="100%" stop-color="#b0a072" />
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ea8c4" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#4d7f9a" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9a8a6a" stroke-width="0.4" stroke-opacity="0.3" />
    </pattern>
    <filter id="engrave" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.1" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="url(#parchment)" />
  <rect width="1536" height="1024" fill="url(#hatch)" />
  <rect width="1536" height="1024" fill="url(#sky)" />

  <rect x="18" y="18" width="1500" height="988" fill="none" stroke="#7a6540" stroke-width="3" opacity="0.7" />
  <rect x="28" y="28" width="1480" height="968" fill="none" stroke="#7a6540" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.5" />

  <!-- Mountain massif -->
  <g transform="translate(820, 250)" filter="url(#engrave)">
    <!-- outer slopes -->
    <path d="M -420,600 L -230,180 C -180,90 -120,60 -60,58 C 0,56 60,86 110,175 L 320,600 Z"
          fill="url(#slope)" stroke="#8a7550" stroke-width="2.5" />
    <!-- snow cap ridges -->
    <g stroke="#8a7550" stroke-width="1.1" opacity="0.45" fill="none">
      <path d="M -230,180 L -150,320 M -60,58 L -30,240 M 110,175 L 60,320" />
      <path d="M -300,420 L -120,380 L 40,410 L 210,375" />
      <path d="M -360,520 L -160,485 L 30,515 L 250,480" />
    </g>
    <!-- caldera rim + Heaven Lake -->
    <ellipse cx="10" cy="120" rx="120" ry="46" fill="#d8cba0" stroke="#8a7550" stroke-width="2" />
    <ellipse cx="10" cy="122" rx="92" ry="33" fill="url(#lake)" stroke="#3a6a88" stroke-width="1.5" />
    <text x="10" y="127" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#e8f0f4" font-style="italic">Heaven Lake</text>
    <!-- summit marker -->
    <circle cx="-60" cy="58" r="9" fill="#c0392b" stroke="#8b1a1a" stroke-width="2" />
    <text x="-48" y="52" font-family="Georgia, serif" font-size="15" fill="#5a3020" font-style="italic" font-weight="bold">2,744 m</text>
  </g>

  <!-- Compass rose -->
  <g transform="translate(250, 720)">
    <circle cx="0" cy="0" r="78" fill="none" stroke="#8a7550" stroke-width="1.5" opacity="0.6" />
    <circle cx="0" cy="0" r="60" fill="#d4c9a8" fill-opacity="0.4" stroke="#8a7550" stroke-width="1" opacity="0.5" />
    <polygon points="0,-60 -9,-24 0,-36 9,-24" fill="#5a3020" stroke="#3a1a0a" stroke-width="0.5" />
    <polygon points="0,60 -9,24 0,36 9,24" fill="#c8b98a" stroke="#8a7550" stroke-width="0.5" />
    <polygon points="60,0 24,-9 36,0 24,9" fill="#c8b98a" stroke="#8a7550" stroke-width="0.5" />
    <polygon points="-60,0 -24,-9 -36,0 -24,9" fill="#c8b98a" stroke="#8a7550" stroke-width="0.5" />
    <text x="0" y="-66" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#3a1a0a" font-weight="bold">N</text>
    <text x="0" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5a4530">S</text>
    <text x="78" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5a4530">E</text>
    <text x="-78" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5a4530">W</text>
  </g>

  <!-- Title block -->
  <text x="108" y="200" font-family="Georgia, serif" font-size="82" fill="#3a2810" font-weight="bold" letter-spacing="4">MOUNT PAEKTU</text>
  <g transform="translate(108, 218)">
    <line x1="0" y1="0" x2="620" y2="0" stroke="#8a7550" stroke-width="2.5" />
    <line x1="0" y1="6" x2="620" y2="6" stroke="#8a7550" stroke-width="1" />
    <polygon points="310,18 305,10 315,10" fill="#8a7550" />
  </g>
  <text x="108" y="278" font-family="Georgia, serif" font-size="26" fill="#5a4530" font-style="italic" letter-spacing="2">Sacred stratovolcano · China–DPRK border · 白頭山</text>

  <!-- Fact card -->
  <g transform="translate(108, 640)">
    <rect x="0" y="0" width="150" height="34" fill="#7a6540" rx="3" />
    <text x="12" y="23" font-family="Georgia, serif" font-size="15" fill="#e8dfc8" letter-spacing="2">GEOGRAPHY</text>
    <text x="0" y="74" font-family="Georgia, serif" font-size="18" fill="#3a2810" font-weight="bold">Elevation:</text>
    <text x="0" y="98" font-family="Georgia, serif" font-size="16" fill="#5a4030" font-style="italic">2,744 m — highest peak on the Korean peninsula</text>
    <text x="0" y="138" font-family="Georgia, serif" font-size="18" fill="#3a2810" font-weight="bold">Millennium Eruption:</text>
    <text x="0" y="162" font-family="Georgia, serif" font-size="16" fill="#5a4030" font-style="italic">c. 946 CE — one of the largest of the Holocene</text>
    <text x="0" y="204" font-family="Georgia, serif" font-size="16" fill="#5a4030" font-style="italic" opacity="0.75">"Where the spirit of the nation is said to reside"</text>
  </g>

  <text x="1400" y="980" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#8a7550" font-style="italic" opacity="0.6">Atlas Plate · DPRK · Korean Peninsula</text>

  <g stroke="#8a7550" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 45,45 L 80,45 L 80,50 M 45,45 L 45,80 L 50,80" />
    <path d="M 1491,45 L 1456,45 L 1456,50 M 1491,45 L 1491,80 L 1486,80" />
    <path d="M 45,979 L 80,979 L 80,974 M 45,979 L 45,944 L 50,944" />
    <path d="M 1491,979 L 1456,979 L 1456,974 M 1491,979 L 1491,944 L 1486,944" />
  </g>
  <rect x="0" y="0" width="1536" height="1024" fill="none" stroke="#5a4030" stroke-width="8" opacity="0.15" />
</svg>
