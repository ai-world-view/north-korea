<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Songun (Military-First) Ideology — DPRK State Doctrine</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#c9b98a" />
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#f0e4bf" />
      <stop offset="100%" stop-color="#c9b98a" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#b8a070" stroke-width="0.4" opacity="0.4" />
    </pattern>
    <linearGradient id="titleBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1f0e" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#2a1f0e" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#2a1f0e" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)" />
  <rect width="1536" height="1024" fill="url(#grid)" />

  <!-- Emblematic composition (right area): hierarchy with the KPA atop -->
  <g transform="translate(1010, 512)">
    <circle cx="0" cy="0" r="440" fill="url(#halo)" />

    <!-- Radiant star burst behind the crowning star -->
    <g transform="translate(0, -250)" stroke="#c8a84a" stroke-width="2" opacity="0.5">
      <line x1="0" y1="0" x2="0" y2="-150" />
      <line x1="0" y1="0" x2="120" y2="-90" />
      <line x1="0" y1="0" x2="-120" y2="-90" />
      <line x1="0" y1="0" x2="150" y2="-30" />
      <line x1="0" y1="0" x2="-150" y2="-30" />
      <line x1="0" y1="0" x2="90" y2="-120" />
      <line x1="0" y1="0" x2="-90" y2="-120" />
      <line x1="0" y1="0" x2="45" y2="-145" />
      <line x1="0" y1="0" x2="-45" y2="-145" />
    </g>

    <!-- Crowning five-pointed star (military supremacy) -->
    <g transform="translate(0, -250)">
      <circle cx="0" cy="0" r="96" fill="#e8dfc8" stroke="#8a6a30" stroke-width="2" opacity="0.85" />
      <polygon points="0,-84 19.8,-26 80,-26 32,10 50.8,68 0,32 -50.8,68 -32,10 -80,-26 -19.8,-26"
               fill="#c8a84a" stroke="#2a1f0e" stroke-width="3" />
      <polygon points="0,-84 6,-26 0,-12 -6,-26" fill="#8a6a30" opacity="0.5" />
    </g>

    <!-- Laurel wreath framing the emblem -->
    <g fill="none" stroke="#c8a84a" stroke-width="5" opacity="0.7" stroke-linecap="round">
      <path d="M -30 250 Q -260 210 -300 -60 Q -305 -140 -270 -210" />
      <path d="M 30 250 Q 260 210 300 -60 Q 305 -140 270 -210" />
    </g>
    <g fill="#c8a84a" opacity="0.6">
      <ellipse cx="-300" cy="20" rx="10" ry="24" transform="rotate(-25 -300 20)" />
      <ellipse cx="-292" cy="90" rx="10" ry="24" transform="rotate(-40 -292 90)" />
      <ellipse cx="-268" cy="155" rx="10" ry="24" transform="rotate(-55 -268 155)" />
      <ellipse cx="-224" cy="208" rx="10" ry="24" transform="rotate(-72 -224 208)" />
      <ellipse cx="-305" cy="-55" rx="10" ry="24" transform="rotate(-8 -305 -55)" />
      <ellipse cx="-292" cy="-125" rx="10" ry="24" transform="rotate(12 -292 -125)" />
      <ellipse cx="300" cy="20" rx="10" ry="24" transform="rotate(25 300 20)" />
      <ellipse cx="292" cy="90" rx="10" ry="24" transform="rotate(40 292 90)" />
      <ellipse cx="268" cy="155" rx="10" ry="24" transform="rotate(55 268 155)" />
      <ellipse cx="224" cy="208" rx="10" ry="24" transform="rotate(72 224 208)" />
      <ellipse cx="305" cy="-55" rx="10" ry="24" transform="rotate(8 305 -55)" />
      <ellipse cx="292" cy="-125" rx="10" ry="24" transform="rotate(-12 292 -125)" />
    </g>

    <!-- Hierarchy tablets: KPA over Party over State -->
    <!-- Top tier: Army (dominant, dark) -->
    <g transform="translate(0, -70)">
      <rect x="-200" y="-40" width="400" height="80" rx="6" fill="#2a1f0e" stroke="#c8a84a" stroke-width="3" opacity="0.95" />
      <text x="0" y="-4" font-family="Georgia, serif" font-size="30" fill="#f5e8c8" text-anchor="middle" font-weight="bold" letter-spacing="3">KPA · ARMY</text>
      <text x="0" y="24" font-family="Georgia, serif" font-size="15" fill="#c8a84a" text-anchor="middle" letter-spacing="2" font-style="italic">first in all things</text>
    </g>

    <!-- connector -->
    <line x1="0" y1="10" x2="0" y2="40" stroke="#8a6a30" stroke-width="3" opacity="0.7" />

    <!-- Middle tier: Party -->
    <g transform="translate(0, 90)">
      <rect x="-170" y="-38" width="340" height="76" rx="6" fill="#c4b48a" stroke="#8a6a30" stroke-width="2.5" opacity="0.9" />
      <text x="0" y="-2" font-family="Georgia, serif" font-size="26" fill="#3a2810" text-anchor="middle" letter-spacing="3">PARTY</text>
      <text x="0" y="24" font-family="Georgia, serif" font-size="14" fill="#5a4020" text-anchor="middle" letter-spacing="1" font-style="italic">Workers' Party of Korea</text>
    </g>

    <!-- connector -->
    <line x1="0" y1="128" x2="0" y2="158" stroke="#8a6a30" stroke-width="3" opacity="0.7" />

    <!-- Bottom tier: State -->
    <g transform="translate(0, 208)">
      <rect x="-140" y="-36" width="280" height="72" rx="6" fill="#d2c295" stroke="#8a6a30" stroke-width="2" opacity="0.85" />
      <text x="0" y="0" font-family="Georgia, serif" font-size="23" fill="#3a2810" text-anchor="middle" letter-spacing="3">STATE</text>
      <text x="0" y="24" font-family="Georgia, serif" font-size="13" fill="#5a4020" text-anchor="middle" letter-spacing="1" font-style="italic">people &amp; institutions</text>
    </g>

    <text x="0" y="330" font-family="Georgia, serif" font-size="16" fill="#5a4020" text-anchor="middle" letter-spacing="4" opacity="0.8">ORDER OF PRIORITY</text>
  </g>

  <!-- Title panel -->
  <rect x="0" y="0" width="480" height="1024" fill="url(#titleBg)" />
  <line x1="40" y1="40" x2="440" y2="40" stroke="#c8a84a" stroke-width="1.5" opacity="0.7" />
  <line x1="40" y1="44" x2="440" y2="44" stroke="#c8a84a" stroke-width="0.5" opacity="0.4" />
  <line x1="40" y1="984" x2="440" y2="984" stroke="#c8a84a" stroke-width="1.5" opacity="0.7" />
  <line x1="40" y1="980" x2="440" y2="980" stroke="#c8a84a" stroke-width="0.5" opacity="0.4" />
  <line x1="40" y1="40" x2="40" y2="984" stroke="#c8a84a" stroke-width="1.5" opacity="0.7" />
  <line x1="44" y1="40" x2="44" y2="984" stroke="#c8a84a" stroke-width="0.5" opacity="0.4" />

  <text x="240" y="120" font-family="Georgia, serif" font-size="14" fill="#c8a84a" text-anchor="middle" letter-spacing="5" opacity="0.9">DPRK · STATE DOCTRINE</text>
  <line x1="70" y1="140" x2="410" y2="140" stroke="#c8a84a" stroke-width="1" opacity="0.5" />

  <text x="240" y="270" font-family="Georgia, serif" font-size="96" fill="#f5e8c8" text-anchor="middle" letter-spacing="8">선군</text>
  <line x1="70" y1="300" x2="410" y2="300" stroke="#c8a84a" stroke-width="1" opacity="0.5" />
  <text x="240" y="380" font-family="Georgia, serif" font-size="72" fill="#f5e8c8" text-anchor="middle" font-weight="bold" letter-spacing="4">SONGUN</text>
  <text x="240" y="430" font-family="Georgia, serif" font-size="22" fill="#c8a84a" text-anchor="middle" letter-spacing="3" font-style="italic">Military-First Politics</text>
  <line x1="100" y1="455" x2="380" y2="455" stroke="#c8a84a" stroke-width="0.8" opacity="0.4" />

  <text x="240" y="515" font-family="Georgia, serif" font-size="17" fill="#e0cfa0" text-anchor="middle" letter-spacing="1">Codified under Kim Jong-il · 1990s</text>
  <text x="240" y="545" font-family="Georgia, serif" font-size="17" fill="#e0cfa0" text-anchor="middle" letter-spacing="1">Army above party and state</text>
  <line x1="100" y1="570" x2="380" y2="570" stroke="#c8a84a" stroke-width="0.8" opacity="0.4" />

  <!-- Star / rifle motif -->
  <g transform="translate(240, 675)" opacity="0.8">
    <polygon points="0,-58 13.6,-17.9 55.2,-17.9 21.8,6.8 34.9,46.9 0,22.4 -34.9,46.9 -21.8,6.8 -55.2,-17.9 -13.6,-17.9"
             fill="none" stroke="#c8a84a" stroke-width="4" stroke-linejoin="round" />
    <polygon points="0,-30 7,-9.2 28.5,-9.2 11.3,3.5 18,24.2 0,11.5 -18,24.2 -11.3,3.5 -28.5,-9.2 -7,-9.2"
             fill="#c8a84a" opacity="0.7" />
  </g>

  <text x="240" y="775" font-family="Georgia, serif" font-size="15" fill="#b89a60" text-anchor="middle" letter-spacing="2">KOREAN PEOPLE'S ARMY ABOVE ALL</text>
  <text x="240" y="797" font-family="Georgia, serif" font-size="15" fill="#b89a60" text-anchor="middle" letter-spacing="2">STATE INSTITUTIONS</text>
  <line x1="100" y1="820" x2="380" y2="820" stroke="#c8a84a" stroke-width="0.8" opacity="0.4" />

  <text x="240" y="860" font-family="Georgia, serif" font-size="15" fill="#9a8050" text-anchor="middle" font-style="italic">Songun chŏngch'i · 선군정치</text>
  <text x="240" y="895" font-family="Georgia, serif" font-size="14" fill="#9a8050" text-anchor="middle" font-style="italic">The gun over the pen</text>

  <text x="240" y="950" font-family="Georgia, serif" font-size="13" fill="#c8a84a" text-anchor="middle" letter-spacing="4" opacity="0.6">ATLAS PLATE · KOREA</text>

  <rect x="8" y="8" width="1520" height="1008" fill="none" stroke="#8a6a30" stroke-width="3" opacity="0.5" />
  <rect x="14" y="14" width="1508" height="996" fill="none" stroke="#c8a84a" stroke-width="1" opacity="0.3" />
  <rect width="1536" height="1024" fill="#c8a050" opacity="0.04" />
</svg>
