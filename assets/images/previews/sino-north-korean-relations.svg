<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Sino–North Korean Relations — The 'Blood Alliance' of China and the DPRK</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#c9b98a" />
    </radialGradient>
    <radialGradient id="sea" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8aacb8" />
      <stop offset="100%" stop-color="#5e8a9a" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#b8a070" stroke-width="0.4" opacity="0.4" />
    </pattern>
    <linearGradient id="titleBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1f0e" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#2a1f0e" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#2a1f0e" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)" />
  <rect width="1536" height="1024" fill="url(#grid)" />

  <!-- Yellow Sea / West Sea -->
  <ellipse cx="820" cy="960" rx="520" ry="360" fill="url(#sea)" opacity="0.8" />
  <text x="900" y="945" font-family="Georgia, serif" font-size="22" fill="#3a5a6a" opacity="0.7" text-anchor="middle" letter-spacing="3" font-style="italic">YELLOW SEA</text>
  <text x="900" y="973" font-family="Georgia, serif" font-size="16" fill="#3a5a6a" opacity="0.5" text-anchor="middle" letter-spacing="2" font-style="italic">(WEST SEA)</text>

  <!-- East Sea (upper right) -->
  <ellipse cx="1440" cy="380" rx="240" ry="360" fill="url(#sea)" opacity="0.7" />
  <text x="1470" y="330" font-family="Georgia, serif" font-size="18" fill="#3a5a6a" opacity="0.6" text-anchor="middle" letter-spacing="2" font-style="italic">EAST SEA</text>

  <!-- China (west) — large landmass -->
  <path d="M 500 60 L 1010 60 L 980 180 L 900 250 L 830 320 L 810 410 L 760 470 L 700 520 L 620 560 L 540 600 L 500 640 L 500 60 Z" fill="#d2c295" stroke="#8a6a30" stroke-width="2.5" />
  <text x="660" y="260" font-family="Georgia, serif" font-size="46" fill="#5a4020" text-anchor="middle" letter-spacing="6" opacity="0.75">CHINA</text>
  <text x="660" y="300" font-family="Georgia, serif" font-size="17" fill="#3a2810" text-anchor="middle" opacity="0.75" letter-spacing="2">People's Republic of China</text>
  <text x="900" y="200" font-family="Georgia, serif" font-size="14" fill="#3a2810" opacity="0.8">Jilin · Liaoning</text>

  <!-- DPRK (northern Korean peninsula) -->
  <path d="M 1010 60 L 1130 90 L 1180 180 L 1210 290 L 1180 400 L 1120 490 L 1040 560 L 960 620 L 900 660 L 850 620 L 830 540 L 810 460 L 830 380 L 830 320 L 900 250 L 980 180 L 1010 60 Z" fill="#c4b48a" stroke="#8a6a30" stroke-width="2.5" />
  <text x="1030" y="420" font-family="Georgia, serif" font-size="34" fill="#5a4020" text-anchor="middle" letter-spacing="3" opacity="0.8">DPRK</text>
  <text x="1030" y="452" font-family="Georgia, serif" font-size="14" fill="#3a2810" text-anchor="middle" opacity="0.75" letter-spacing="1">North Korea</text>

  <!-- Yalu River border (China ↔ DPRK) -->
  <path d="M 1010 60 Q 950 150 900 250 Q 850 350 830 460 Q 820 520 850 560" stroke="#4a7a9a" stroke-width="5" fill="none" opacity="0.85" />
  <text x="920" y="140" font-family="Georgia, serif" font-size="15" fill="#2a5a7a" font-style="italic" opacity="0.9" transform="rotate(52 920 140)">Yalu R.</text>

  <!-- Tumen River (northeast leg) -->
  <path d="M 1010 60 Q 1080 80 1130 90 Q 1160 130 1180 180" stroke="#4a7a9a" stroke-width="4" fill="none" opacity="0.75" />
  <text x="1120" y="70" font-family="Georgia, serif" font-size="13" fill="#2a5a7a" font-style="italic" opacity="0.8">Tumen R.</text>

  <!-- "Lips and teeth" tie line between Dandong (China) and Sinuiju (DPRK) -->
  <path d="M 858 440 Q 895 460 935 490" stroke="#8a2a1a" stroke-width="3" stroke-dasharray="8,5" fill="none" opacity="0.7" />

  <!-- Dandong (China side) marker -->
  <circle cx="858" cy="440" r="10" fill="#4a6a3a" stroke="#f0e0c0" stroke-width="2" />
  <circle cx="858" cy="440" r="4" fill="#f0e0c0" />
  <text x="760" y="435" font-family="Georgia, serif" font-size="14" fill="#2a1208">Dandong</text>

  <!-- Sinuiju (DPRK side) crossing marker -->
  <circle cx="935" cy="490" r="18" fill="#8a2a1a" stroke="#f0e0c0" stroke-width="3" />
  <circle cx="935" cy="490" r="8" fill="#f0e0c0" />
  <text x="963" y="480" font-family="Georgia, serif" font-size="20" fill="#2a1208" font-weight="bold" letter-spacing="1">신의주</text>
  <text x="963" y="502" font-family="Georgia, serif" font-size="16" fill="#2a1208" font-weight="bold" letter-spacing="0.5">SINŬIJU</text>
  <text x="963" y="522" font-family="Georgia, serif" font-size="12" fill="#3a2810" font-style="italic">Sino–DPRK Friendship Bridge</text>

  <!-- Pyongyang marker -->
  <circle cx="1005" cy="560" r="9" fill="#2a5a7a" stroke="#f0e0c0" stroke-width="2" />
  <circle cx="1005" cy="560" r="3.5" fill="#f0e0c0" />
  <text x="1020" y="565" font-family="Georgia, serif" font-size="13" fill="#2a1208">Pyongyang</text>

  <!-- Compass rose -->
  <g transform="translate(1400, 830)">
    <circle cx="0" cy="0" r="55" fill="#d8c898" stroke="#8a6a30" stroke-width="1.5" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#8a6a30" stroke-width="1" />
    <polygon points="0,-50 -7,-28 7,-28" fill="#2a1208" />
    <polygon points="0,50 -7,28 7,28" fill="#8a6a30" opacity="0.5" />
    <polygon points="-50,0 -28,-7 -28,7" fill="#8a6a30" opacity="0.5" />
    <polygon points="50,0 28,-7 28,7" fill="#8a6a30" opacity="0.5" />
    <text x="0" y="-54" font-family="Georgia, serif" font-size="16" fill="#2a1208" text-anchor="middle" font-weight="bold">N</text>
    <text x="0" y="68" font-family="Georgia, serif" font-size="12" fill="#5a4020" text-anchor="middle">S</text>
    <text x="-62" y="4" font-family="Georgia, serif" font-size="12" fill="#5a4020" text-anchor="middle">W</text>
    <text x="62" y="4" font-family="Georgia, serif" font-size="12" fill="#5a4020" text-anchor="middle">E</text>
    <circle cx="0" cy="0" r="5" fill="#8a6a30" />
  </g>

  <!-- Title panel -->
  <rect x="0" y="0" width="480" height="1024" fill="url(#titleBg)" />
  <line x1="40" y1="40" x2="440" y2="40" stroke="#c8a84a" stroke-width="1.5" opacity="0.7" />
  <line x1="40" y1="44" x2="440" y2="44" stroke="#c8a84a" stroke-width="0.5" opacity="0.4" />
  <line x1="40" y1="984" x2="440" y2="984" stroke="#c8a84a" stroke-width="1.5" opacity="0.7" />
  <line x1="40" y1="980" x2="440" y2="980" stroke="#c8a84a" stroke-width="0.5" opacity="0.4" />
  <line x1="40" y1="40" x2="40" y2="984" stroke="#c8a84a" stroke-width="1.5" opacity="0.7" />
  <line x1="44" y1="40" x2="44" y2="984" stroke="#c8a84a" stroke-width="0.5" opacity="0.4" />

  <text x="240" y="110" font-family="Georgia, serif" font-size="14" fill="#c8a84a" text-anchor="middle" letter-spacing="5" opacity="0.9">DPRK · FOREIGN RELATIONS</text>
  <line x1="70" y1="130" x2="410" y2="130" stroke="#c8a84a" stroke-width="1" opacity="0.5" />

  <text x="240" y="235" font-family="Georgia, serif" font-size="60" fill="#f5e8c8" text-anchor="middle" letter-spacing="6">조중관계</text>
  <line x1="70" y1="262" x2="410" y2="262" stroke="#c8a84a" stroke-width="1" opacity="0.5" />
  <text x="240" y="330" font-family="Georgia, serif" font-size="52" fill="#f5e8c8" text-anchor="middle" font-weight="bold" letter-spacing="1">CHINA &amp; THE DPRK</text>
  <text x="240" y="382" font-family="Georgia, serif" font-size="20" fill="#c8a84a" text-anchor="middle" letter-spacing="2" font-style="italic">The 'Blood Alliance', 1949–present</text>
  <line x1="100" y1="410" x2="380" y2="410" stroke="#c8a84a" stroke-width="0.8" opacity="0.4" />

  <text x="240" y="470" font-family="Georgia, serif" font-size="17" fill="#e0cfa0" text-anchor="middle" letter-spacing="1">1961 Mutual Defense Treaty</text>
  <text x="240" y="500" font-family="Georgia, serif" font-size="17" fill="#e0cfa0" text-anchor="middle" letter-spacing="1">≈90% of DPRK trade</text>
  <line x1="100" y1="525" x2="380" y2="525" stroke="#c8a84a" stroke-width="0.8" opacity="0.4" />

  <!-- Clasped-hands / alliance motif -->
  <g transform="translate(240, 630)" stroke="#c8a84a" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M -80 0 L -12 0 L 12 -22" />
    <path d="M 80 0 L 12 0 L -12 22" />
  </g>

  <text x="240" y="730" font-family="Georgia, serif" font-size="15" fill="#b89a60" text-anchor="middle" letter-spacing="2">"AS CLOSE AS LIPS AND TEETH"</text>
  <text x="240" y="752" font-family="Georgia, serif" font-size="15" fill="#b89a60" text-anchor="middle" letter-spacing="2">KOREAN WAR · CPV · TREATY OF 1961</text>
  <line x1="100" y1="775" x2="380" y2="775" stroke="#c8a84a" stroke-width="0.8" opacity="0.4" />

  <text x="240" y="815" font-family="Georgia, serif" font-size="15" fill="#9a8050" text-anchor="middle" font-style="italic">Pyongyang · Beijing</text>
  <text x="240" y="855" font-family="Georgia, serif" font-size="14" fill="#9a8050" text-anchor="middle" font-style="italic">Sole formal military ally of the DPRK</text>

  <text x="240" y="950" font-family="Georgia, serif" font-size="13" fill="#c8a84a" text-anchor="middle" letter-spacing="4" opacity="0.6">ATLAS PLATE · KOREA</text>

  <!-- Scale bar -->
  <g transform="translate(1040, 960)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#5a4020" stroke-width="2" />
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#5a4020" stroke-width="2" />
    <line x1="60" y1="-4" x2="60" y2="4" stroke="#5a4020" stroke-width="1.5" />
    <line x1="120" y1="-6" x2="120" y2="6" stroke="#5a4020" stroke-width="2" />
    <rect x="0" y="-2" width="60" height="4" fill="#5a4020" />
    <rect x="60" y="-2" width="60" height="4" fill="#d8c898" />
    <text x="0" y="-12" font-family="Georgia, serif" font-size="11" fill="#3a2010" text-anchor="middle">0</text>
    <text x="60" y="-12" font-family="Georgia, serif" font-size="11" fill="#3a2010" text-anchor="middle">100</text>
    <text x="120" y="-12" font-family="Georgia, serif" font-size="11" fill="#3a2010" text-anchor="middle">200 km</text>
  </g>

  <rect x="8" y="8" width="1520" height="1008" fill="none" stroke="#8a6a30" stroke-width="3" opacity="0.5" />
  <rect x="14" y="14" width="1508" height="996" fill="none" stroke="#c8a84a" stroke-width="1" opacity="0.3" />
  <rect width="1536" height="1024" fill="#c8a050" opacity="0.04" />
</svg>
