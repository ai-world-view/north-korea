<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Pyongyang – Capital of North Korea</title>
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c9a8" />
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ea8c4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#5d8fa8" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="landgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b98a" />
      <stop offset="100%" stop-color="#b8a87a" />
    </linearGradient>
    <filter id="engrave" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9a8a6a" stroke-width="0.4" stroke-opacity="0.3" />
    </pattern>
    <pattern id="crosshatch" patternUnits="userSpaceOnUse" width="10" height="10">
      <line x1="0" y1="0" x2="10" y2="10" stroke="#7a6a4a" stroke-width="0.3" stroke-opacity="0.25" />
      <line x1="10" y1="0" x2="0" y2="10" stroke="#7a6a4a" stroke-width="0.3" stroke-opacity="0.25" />
    </pattern>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#parchment)" />
  <rect width="1536" height="1024" fill="url(#hatch)" />

  
  <rect x="18" y="18" width="1500" height="988" fill="none" stroke="#7a6540" stroke-width="3" opacity="0.7" />
  
  <rect x="28" y="28" width="1480" height="968" fill="none" stroke="#7a6540" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.5" />

  
  
