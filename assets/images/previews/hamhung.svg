<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Hamhung – Second-Largest City of the DPRK, East Coast Industrial Center</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#c9b98a" />
    </radialGradient>
    <radialGradient id="sea" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8aacb8" />
      <stop offset="100%" stop-color="#5e8a9a" />
    </radialGradient>
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noiseOut" />
      <feColorMatrix type="saturate" values="0" in="noiseOut" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
      <feComposite in="blend" in2="SourceGraphic" operator="in" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#b8a070" stroke-width="0.4" opacity="0.4" />
    </pattern>
    <linearGradient id="titleBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1f0e" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#2a1f0e" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#2a1f0e" stop-opacity="0" />
    </linearGradient>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#bg)" />
  <rect width="1536" height="1024" fill="url(#grid)" />

  
  <ellipse cx="1200" cy="480" rx="500" ry="420" fill="url(#sea)" opacity="0.85" />
  <ellipse cx="1400" cy="300" rx="250" ry="200" fill="#7aa0ae" opacity="0.6" />

  
  <text x="1300" y="340" font-family="Georgia, serif" font-size="22" fill="#3a5a6a" opacity="0.7" text-anchor="middle" letter-spacing="3" font-style="italic">SEA OF JAPAN</text>
  <text x="1300" y="368" font-family="Georgia, serif" font-size="16" fill="#3a5a6a" opacity="0.5" text-anchor="middle" letter-spacing="2" font-style="italic">(EAST SEA)</text>

  
  
  <path d="     M 580 60     L 640 80     L 700 70     L 760 90     L 800 130     L 820 180     L 810 240     L 840 300     L 870 360     L 890 420     L 880 480     L 860 530     L 870 580     L 860 630     L 830 680     L 800 720     L 770 760     L 740 800     L 720 840     L 700 870     L 680 890     L 660 880     L 650 850     L 660 820     L 650 790     L 630 760     L 610 730     L 590 700     L 570 660     L 550 620     L 540 580     L 530 540     L 520 500     L 510 460     L 500 420     L 490 380     L 480 340     L 470 300     L 460 260     L 450 220     L 460 180     L 490 140     L 530 100     Z   " fill="#c4b48a" stroke="#8a6a30" stroke-width="2" />

  
