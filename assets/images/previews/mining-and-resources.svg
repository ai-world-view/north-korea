<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Mining and Resource Extraction — DPRK Economy Plate</title>
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc0" />
      <stop offset="50%" stop-color="#ddd0a8" />
      <stop offset="100%" stop-color="#c9bc90" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#00000000" />
      <stop offset="100%" stop-color="#3a2a1055" />
    </radialGradient>
    <pattern id="hatch" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#8a7545" stroke-width="0.4" opacity="0.3" />
    </pattern>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3a2500" flood-opacity="0.35" />
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#1a0e00" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="url(#parchment)" />
  <rect width="1536" height="1024" fill="url(#hatch)" />

  <rect x="18" y="18" width="1500" height="988" rx="4" fill="none" stroke="#7a6030" stroke-width="6" />
  <rect x="28" y="28" width="1480" height="968" rx="3" fill="none" stroke="#9a8050" stroke-width="2" />
  <rect x="32" y="32" width="1472" height="960" rx="2" fill="none" stroke="#7a6030" stroke-width="1" />

  <g stroke="#7a6030" stroke-width="2" fill="none">
    <line x1="18" y1="60" x2="60" y2="60" /><line x1="60" y1="18" x2="60" y2="60" />
    <line x1="1476" y1="60" x2="1518" y2="60" /><line x1="1476" y1="18" x2="1476" y2="60" />
    <line x1="18" y1="964" x2="60" y2="964" /><line x1="60" y1="964" x2="60" y2="1006" />
    <line x1="1476" y1="964" x2="1518" y2="964" /><line x1="1476" y1="964" x2="1476" y2="1006" />
  </g>

  <!-- Right imagery panel: mine cross-section + ore -->
  <g transform="translate(1080, 0)">
    <!-- ground line -->
    <line x1="-160" y1="300" x2="320" y2="300" stroke="#5a4020" stroke-width="3" />
    <!-- open-pit terraces -->
    <g stroke="#6b4a24" stroke-width="2" fill="#a88a56" opacity="0.85">
      <polygon points="-120,300 260,300 200,360 -60,360" />
      <polygon points="-60,360 200,360 150,415 -10,415" fill="#96784a" />
      <polygon points="-10,415 150,415 105,465 30,465" fill="#83683e" />
    </g>
    <!-- shaft into rock -->
    <rect x="-150" y="470" width="470" height="330" fill="#3a2c18" opacity="0.9" stroke="#241a0c" stroke-width="2" filter="url(#softShadow)" />
    <line x1="60" y1="465" x2="60" y2="800" stroke="#1a1206" stroke-width="4" />
    <!-- ore veins / minerals -->
    <g font-family="Georgia, serif" font-size="12" text-anchor="middle">
      <circle cx="-40" cy="560" r="16" fill="#2a2a2a" stroke="#000" stroke-width="1" />
      <text x="-40" y="590" fill="#e0c890">coal</text>
      <circle cx="150" cy="560" r="16" fill="#c8b830" stroke="#7a6a10" stroke-width="1" />
      <text x="150" y="590" fill="#5a4a10" font-weight="bold">U</text>
      <text x="150" y="620" fill="#5a4030" font-style="italic">uranium</text>
      <circle cx="-40" cy="680" r="16" fill="#7a3a1a" stroke="#3a1a08" stroke-width="1" />
      <text x="-40" y="710" fill="#e0c890">iron</text>
      <circle cx="150" cy="680" r="16" fill="#4a6a7a" stroke="#20343a" stroke-width="1" />
      <text x="150" y="710" fill="#e0c890">REE</text>
    </g>
    <text x="60" y="256" font-family="Georgia, serif" font-size="15" fill="#5a4030" text-anchor="middle" font-style="italic" letter-spacing="1">$6–10 trillion in the ground</text>
  </g>

  <!-- Left text panel -->
  <rect x="50" y="50" width="640" height="924" rx="3" fill="#d8c898" opacity="0.5" />
  <rect x="50" y="50" width="640" height="924" fill="url(#hatch)" opacity="0.4" />
  <line x1="710" y1="60" x2="710" y2="964" stroke="#7a6030" stroke-width="3" />
  <line x1="715" y1="60" x2="715" y2="964" stroke="#9a8050" stroke-width="1" />

  <text x="370" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold" fill="#2a1505" text-anchor="middle" letter-spacing="1" filter="url(#textShadow)">Mining</text>
  <text x="370" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="#2a1505" text-anchor="middle" letter-spacing="1" filter="url(#textShadow)">&amp; Resources</text>
  <text x="370" y="258" font-family="Georgia, serif" font-size="22" fill="#6a4010" text-anchor="middle" font-style="italic" letter-spacing="1">Democratic People's Republic of Korea</text>

  <line x1="110" y1="285" x2="630" y2="285" stroke="#7a6030" stroke-width="2" />
  <line x1="140" y1="290" x2="600" y2="290" stroke="#9a8050" stroke-width="1" />

  <g font-family="Georgia, serif">
    <text x="110" y="345" font-size="19" fill="#3a2810" font-weight="bold">Reserves:</text>
    <text x="630" y="345" font-size="19" fill="#5a4030" text-anchor="end" font-style="italic">est. $6–10 trillion (KORES)</text>
    <line x1="110" y1="362" x2="630" y2="362" stroke="#9a8050" stroke-width="0.8" opacity="0.6" />

    <text x="110" y="408" font-size="19" fill="#3a2810" font-weight="bold">Coal peak:</text>
    <text x="630" y="408" font-size="19" fill="#5a4030" text-anchor="end" font-style="italic">~$1.0–1.2 bn/yr (2015–16)</text>
    <line x1="110" y1="425" x2="630" y2="425" stroke="#9a8050" stroke-width="0.8" opacity="0.6" />

    <text x="110" y="471" font-size="19" fill="#3a2810" font-weight="bold">Coal export ban:</text>
    <text x="630" y="471" font-size="19" fill="#5a4030" text-anchor="end" font-style="italic">UNSCR 2371 (2017)</text>
    <line x1="110" y1="488" x2="630" y2="488" stroke="#9a8050" stroke-width="0.8" opacity="0.6" />

    <text x="110" y="534" font-size="19" fill="#3a2810" font-weight="bold">Key minerals:</text>
    <text x="630" y="534" font-size="19" fill="#5a4030" text-anchor="end" font-style="italic">coal · iron · magnesite · REE · U</text>
    <line x1="110" y1="551" x2="630" y2="551" stroke="#9a8050" stroke-width="0.8" opacity="0.6" />
  </g>

  <rect x="110" y="600" width="520" height="290" rx="3" fill="#4a3a2a" stroke="#2a1a0a" stroke-width="2" filter="url(#softShadow)" opacity="0.92" />
  <text x="370" y="644" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#f5e8c0" text-anchor="middle" letter-spacing="2">EXTRACTION UNDER SANCTIONS</text>
  <line x1="150" y1="662" x2="590" y2="662" stroke="#c8a870" stroke-width="1" opacity="0.6" />
  <text x="370" y="700" font-family="Georgia, serif" font-size="15" fill="#e0c890" text-anchor="middle" font-style="italic">coal exports to China — top hard-currency source</text>
  <text x="370" y="730" font-family="Georgia, serif" font-size="15" fill="#e0c890" text-anchor="middle" font-style="italic">Musan iron · Tanchon magnesite · Jongju rare earths</text>
  <text x="370" y="760" font-family="Georgia, serif" font-size="15" fill="#e0c890" text-anchor="middle" font-style="italic">uranium mining feeds the nuclear fuel cycle</text>
  <text x="370" y="790" font-family="Georgia, serif" font-size="15" fill="#e0c890" text-anchor="middle" font-style="italic">KPA operator · forced labor from kwanliso camps</text>
  <text x="370" y="826" font-family="Georgia, serif" font-size="15" fill="#e0c890" text-anchor="middle" font-style="italic">ship-to-ship smuggling continues post-2017 ban</text>
  <text x="370" y="864" font-family="Georgia, serif" font-size="13" fill="#c8a870" text-anchor="middle">vast reserves, minimal realized capacity</text>

  <text x="370" y="945" font-family="Georgia, serif" font-size="16" fill="#8a6030" text-anchor="middle" font-style="italic" letter-spacing="1">Economy</text>

  <text x="1400" y="985" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#8a7550" font-style="italic" opacity="0.6">Atlas Plate · DPRK · Korean Peninsula</text>

  <rect width="1536" height="1024" fill="url(#vignette)" />
</svg>
