<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Agriculture and Food Security — DPRK Economy Plate</title>
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc0" />
      <stop offset="50%" stop-color="#ddd0a8" />
      <stop offset="100%" stop-color="#c9bc90" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#00000000" />
      <stop offset="100%" stop-color="#3a2a1055" />
    </radialGradient>
    <pattern id="hatch" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#8a7545" stroke-width="0.4" opacity="0.3" />
    </pattern>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3a2500" flood-opacity="0.35" />
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#1a0e00" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="url(#parchment)" />
  <rect width="1536" height="1024" fill="url(#hatch)" />

  <rect x="18" y="18" width="1500" height="988" rx="4" fill="none" stroke="#7a6030" stroke-width="6" />
  <rect x="28" y="28" width="1480" height="968" rx="3" fill="none" stroke="#9a8050" stroke-width="2" />
  <rect x="32" y="32" width="1472" height="960" rx="2" fill="none" stroke="#7a6030" stroke-width="1" />

  <g stroke="#7a6030" stroke-width="2" fill="none">
    <line x1="18" y1="60" x2="60" y2="60" /><line x1="60" y1="18" x2="60" y2="60" />
    <line x1="1476" y1="60" x2="1518" y2="60" /><line x1="1476" y1="18" x2="1476" y2="60" />
    <line x1="18" y1="964" x2="60" y2="964" /><line x1="60" y1="964" x2="60" y2="1006" />
    <line x1="1476" y1="964" x2="1518" y2="964" /><line x1="1476" y1="964" x2="1476" y2="1006" />
  </g>

  <!-- Right imagery panel: terraced paddies under a hard sun -->
  <g transform="translate(1080, 0)">
    <!-- sun -->
    <circle cx="180" cy="180" r="70" fill="#d8a63a" opacity="0.75" filter="url(#softShadow)" />
    <g stroke="#c89430" stroke-width="3" opacity="0.5">
      <line x1="180" y1="70" x2="180" y2="40" /><line x1="180" y1="290" x2="180" y2="320" />
      <line x1="70" y1="180" x2="40" y2="180" /><line x1="290" y1="180" x2="320" y2="180" />
      <line x1="102" y1="102" x2="80" y2="80" /><line x1="258" y1="102" x2="280" y2="80" />
    </g>
    <!-- terraced fields (rice paddies) descending to a river valley -->
    <g stroke="#6b5a2a" stroke-width="2">
      <path d="M -160,360 Q 80,330 320,360 L 320,410 Q 80,382 -160,410 Z" fill="#8faa5a" opacity="0.9" />
      <path d="M -160,410 Q 80,382 320,410 L 320,470 Q 80,442 -160,470 Z" fill="#7f9a4a" opacity="0.9" />
      <path d="M -160,470 Q 80,442 320,470 L 320,535 Q 80,508 -160,535 Z" fill="#6f8a3e" opacity="0.9" />
      <path d="M -160,535 Q 80,508 320,535 L 320,610 Q 80,582 -160,610 Z" fill="#5f7a34" opacity="0.9" />
    </g>
    <!-- river through the valley -->
    <path d="M -160,700 Q 40,650 120,690 Q 220,735 320,700 L 320,760 Q 220,795 120,750 Q 40,710 -160,760 Z" fill="#6a8a9a" opacity="0.8" />
    <!-- ration bowl motif -->
    <g transform="translate(150, 820)">
      <path d="M -70 0 Q 0 90 70 0 Z" fill="#b89a60" stroke="#5a4020" stroke-width="3" />
      <ellipse cx="0" cy="0" rx="70" ry="14" fill="#e8dfc8" stroke="#5a4020" stroke-width="2" />
      <path d="M -6 -34 Q 0 -18 6 -34" fill="none" stroke="#c8a870" stroke-width="2" opacity="0.7" />
    </g>
    <text x="80" y="290" font-family="Georgia, serif" font-size="15" fill="#5a4030" text-anchor="middle" font-style="italic" letter-spacing="1">only ~18–20% arable land</text>
  </g>

  <!-- Left text panel -->
  <rect x="50" y="50" width="640" height="924" rx="3" fill="#d8c898" opacity="0.5" />
  <rect x="50" y="50" width="640" height="924" fill="url(#hatch)" opacity="0.4" />
  <line x1="710" y1="60" x2="710" y2="964" stroke="#7a6030" stroke-width="3" />
  <line x1="715" y1="60" x2="715" y2="964" stroke="#9a8050" stroke-width="1" />

  <text x="370" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold" fill="#2a1505" text-anchor="middle" letter-spacing="1" filter="url(#textShadow)">Agriculture</text>
  <text x="370" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#2a1505" text-anchor="middle" letter-spacing="1" filter="url(#textShadow)">&amp; Food Security</text>
  <text x="370" y="258" font-family="Georgia, serif" font-size="22" fill="#6a4010" text-anchor="middle" font-style="italic" letter-spacing="1">Democratic People's Republic of Korea</text>

  <line x1="110" y1="285" x2="630" y2="285" stroke="#7a6030" stroke-width="2" />
  <line x1="140" y1="290" x2="600" y2="290" stroke="#9a8050" stroke-width="1" />

  <g font-family="Georgia, serif">
    <text x="110" y="345" font-size="19" fill="#3a2810" font-weight="bold">Farm system:</text>
    <text x="630" y="345" font-size="19" fill="#5a4030" text-anchor="end" font-style="italic">collective &amp; state farms (no private land)</text>
    <line x1="110" y1="362" x2="630" y2="362" stroke="#9a8050" stroke-width="0.8" opacity="0.6" />

    <text x="110" y="408" font-size="19" fill="#3a2810" font-weight="bold">Grain output:</text>
    <text x="630" y="408" font-size="19" fill="#5a4030" text-anchor="end" font-style="italic">~4.5–5.5 Mt vs. ~5.5–6.0 Mt need</text>
    <line x1="110" y1="425" x2="630" y2="425" stroke="#9a8050" stroke-width="0.8" opacity="0.6" />

    <text x="110" y="471" font-size="19" fill="#3a2810" font-weight="bold">The famine:</text>
    <text x="630" y="471" font-size="19" fill="#5a4030" text-anchor="end" font-style="italic">"Arduous March" 1994–1998</text>
    <line x1="110" y1="488" x2="630" y2="488" stroke="#9a8050" stroke-width="0.8" opacity="0.6" />

    <text x="110" y="534" font-size="19" fill="#3a2810" font-weight="bold">Distribution:</text>
    <text x="630" y="534" font-size="19" fill="#5a4030" text-anchor="end" font-style="italic">PDS rationing · jangmadang markets</text>
    <line x1="110" y1="551" x2="630" y2="551" stroke="#9a8050" stroke-width="0.8" opacity="0.6" />
  </g>

  <rect x="110" y="600" width="520" height="290" rx="3" fill="#4a3a2a" stroke="#2a1a0a" stroke-width="2" filter="url(#softShadow)" opacity="0.92" />
  <text x="370" y="644" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#f5e8c0" text-anchor="middle" letter-spacing="2">A STRUCTURAL FOOD DEFICIT</text>
  <line x1="150" y1="662" x2="590" y2="662" stroke="#c8a870" stroke-width="1" opacity="0.6" />
  <text x="370" y="700" font-family="Georgia, serif" font-size="15" fill="#e0c890" text-anchor="middle" font-style="italic">post-Soviet collapse ended mechanized farming</text>
  <text x="370" y="730" font-family="Georgia, serif" font-size="15" fill="#e0c890" text-anchor="middle" font-style="italic">recurrent floods and droughts on scarce cropland</text>
  <text x="370" y="760" font-family="Georgia, serif" font-size="15" fill="#e0c890" text-anchor="middle" font-style="italic">military and Pyongyang fed before the countryside</text>
  <text x="370" y="790" font-family="Georgia, serif" font-size="15" fill="#e0c890" text-anchor="middle" font-style="italic">6.28 (2012) &amp; 30 May (2014) reforms half-applied</text>
  <text x="370" y="826" font-family="Georgia, serif" font-size="15" fill="#e0c890" text-anchor="middle" font-style="italic">markets fill the gap the planned system leaves</text>
  <text x="370" y="864" font-family="Georgia, serif" font-size="13" fill="#c8a870" text-anchor="middle">chronic dependence on imports and aid</text>

  <text x="370" y="945" font-family="Georgia, serif" font-size="16" fill="#8a6030" text-anchor="middle" font-style="italic" letter-spacing="1">Economy</text>

  <text x="1400" y="985" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#8a7550" font-style="italic" opacity="0.6">Atlas Plate · DPRK · Korean Peninsula</text>

  <rect width="1536" height="1024" fill="url(#vignette)" />
</svg>
